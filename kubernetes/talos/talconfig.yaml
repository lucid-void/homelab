# Talos cluster definition — edit before running `talhelper genconfig`
# See design/kubernetes.md for full rationale

clusterName: homelab-k8s
endpoint: https://172.16.20.10:6443    # API VIP — floats between control planes
talosVersion: v1.13.2
kubernetesVersion: v1.36.1

cniConfig:
  name: none                            # Cilium installed post-bootstrap (Phase 9)

additionalApiServerCertSans:
  - 172.16.20.10                        # API VIP
  - 172.16.20.11                        # cp-1
  - 172.16.20.12                        # cp-2
  - 172.16.20.13                        # cp-3

# ---------------------------------------------------------------------------
# Patches applied to EVERY node — control planes and the llm-1 worker alike.
# Only genuinely role-specific config belongs under `controlPlane:` below.
# ---------------------------------------------------------------------------
patches:
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/openebs/local
            type: bind
            source: /var/openebs/local
            options:
              - bind
              - rshared
              - rw
        # Image garbage collection. The kubelet defaults (high 85 / low 80)
        # never fired here: nodes sat at 72-76% full while /var/lib/containerd
        # grew to ~30 GB of unused images (every Renovate bump, every Trivy
        # scan job, every rolled-back tag). Reclaiming only at 85% means the
        # first cleanup coincides with disk pressure and pod eviction — which
        # is the worst moment to discover it. Lower thresholds make kubelet
        # prune continuously instead of hoarding until crisis.
        extraConfig:
          imageGCHighThresholdPercent: 70
          imageGCLowThresholdPercent: 55
  - |-
    # Netbird (wt0) adds a second IP that the kubelet may otherwise pick as the
    # node IP. One of the three Netbird isolation guards — see AI_CONTEXT.md.
    machine:
      kubelet:
        nodeIP:
          validSubnets:
            - 172.16.20.0/24
  - |-
    apiVersion: v1alpha1
    kind: ExtensionServiceConfig
    name: lldpd
    configFiles:
      - content: |
          configure lldp portidsubtype ifname
          configure system description "Talos Node"
        mountPath: /usr/local/etc/lldpd/lldpd.conf
  - |-
    apiVersion: v1alpha1
    kind: ExtensionServiceConfig
    name: netbird
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY}

controlPlane:
  patches:
    - |-
      cluster:
        proxy:
          disabled: true
        allowSchedulingOnControlPlanes: true
        etcd:
          advertisedSubnets:
            - 172.16.20.0/24
          listenSubnets:
            - 172.16.20.0/24
          # Plaintext metrics listener for vmagent scraping (internal VLAN).
          # Took effect after a node reboot (Talos cannot restart etcd via API);
          # the kubeEtcd scrape is now enabled in the vm-stack HelmRelease.
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
        # Expose controller-manager + scheduler metrics off localhost so
        # vmagent can scrape :10257 / :10259 (kubeControllerManager/kubeScheduler).
        controllerManager:
          extraArgs:
            bind-address: "0.0.0.0"
        scheduler:
          extraArgs:
            bind-address: "0.0.0.0"

nodes:
  - hostname: cp-1
    ipAddress: 172.16.20.11
    installDisk: /dev/sda
    controlPlane: true
    patches:
      - |-
        # Netbird (wt0) adds a second IP that containerd picks as the hostNetwork pod IP.
        # Without this override, kube-apiserver advertises the Netbird IP in endpoints,
        # breaking ClusterIP routing for any node where Cilium can't route Netbird IPs.
        cluster:
          apiServer:
            extraArgs:
              advertise-address: 172.16.20.11
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/lldpd
            - siderolabs/netbird
            # - siderolabs/nut-client  # NUT client is disabled on CPs to avoid potential issues with power management during cluster upgrades (e.g. if a CP reboots before draining, it could cause a brief outage)
            - siderolabs/qemu-guest-agent
    networkInterfaces:
      - interface: ens18
        addresses: [172.16.20.11/24]
        mtu: 9000
        routes:
          - network: 0.0.0.0/0
            gateway: 172.16.20.254
        dhcp: false
        nameservers:
          - 172.16.20.254
        vip:
          ip: 172.16.20.10              # shared API VIP — held by whichever CP wins leader election

  - hostname: cp-2
    ipAddress: 172.16.20.12
    installDisk: /dev/sda
    controlPlane: true
    patches:
      - |-
        # See comment on k8s-cp-1 patch — same Netbird IP override needed on all CPs.
        cluster:
          apiServer:
            extraArgs:
              advertise-address: 172.16.20.12
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/lldpd
            - siderolabs/netbird
            # - siderolabs/nut-client
            - siderolabs/qemu-guest-agent
    networkInterfaces:
      - interface: ens18
        addresses: [172.16.20.12/24]
        mtu: 9000
        routes:
          - network: 0.0.0.0/0
            gateway: 172.16.20.254
        dhcp: false
        nameservers:
          - 172.16.20.254
        vip:
          ip: 172.16.20.10

  - hostname: cp-3
    ipAddress: 172.16.20.13
    installDisk: /dev/sda
    controlPlane: true
    patches:
      - |-
        # See comment on k8s-cp-1 patch — same Netbird IP override needed on all CPs.
        cluster:
          apiServer:
            extraArgs:
              advertise-address: 172.16.20.13
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/lldpd
            - siderolabs/netbird
            # - siderolabs/nut-client
            - siderolabs/qemu-guest-agent
    networkInterfaces:
      - interface: ens18
        addresses: [172.16.20.13/24]
        mtu: 9000
        routes:
          - network: 0.0.0.0/0
            gateway: 172.16.20.254
        dhcp: false
        nameservers:
          - 172.16.20.254
        vip:
          ip: 172.16.20.10

  # Dedicated LLM inference worker — see design/llm-inference.md.
  # Deliberately NOT a control plane: model inference must not share a node with
  # an etcd member (page-cache eviction → fsync latency → leader-election churn),
  # and 100 GB with image GC at 70% does not fit model weights. Tainted so the
  # rest of the cluster stays off it; the matching `workload: llm` node label is
  # what llama.cpp's nodeSelector targets. An OOM here costs the LLM, not etcd.
  - hostname: llm-1
    ipAddress: 172.16.20.14
    installDisk: /dev/sda
    controlPlane: false
    nodeLabels:
      workload: llm
    nodeTaints:
      workload: llm:NoSchedule
    # NOTE: node-level, NOT under networkInterfaces[] where the cp-1/2/3 blocks
    # below put it. talhelper's `Device` schema has no `nameservers` key and
    # genconfig drops unknown keys instead of erroring, so the interface-level
    # setting is a silent no-op — verified on the live cluster, where cp-1's
    # ResolverStatus reads ["1.1.1.1","8.8.8.8"] rather than the UDM SE.
    # Do not "tidy" this by moving it into the interface block.
    nameservers:
      - 172.16.20.254
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/lldpd
            - siderolabs/netbird
            # - siderolabs/nut-client
            - siderolabs/qemu-guest-agent
    networkInterfaces:
      - interface: ens18
        addresses: [172.16.20.14/24]
        mtu: 9000                       # must match the CPs — Cilium MTU is pinned to 9000
        routes:
          - network: 0.0.0.0/0
            gateway: 172.16.20.254
        dhcp: false
        # No `vip:` — the API VIP is held by control planes only.
