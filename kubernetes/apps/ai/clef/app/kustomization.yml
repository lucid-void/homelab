---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./priorityclass.yml
  - ./pvc.yml
  - ./deployment.yml
  - ./service.yml
configMapGenerator:
  - name: clef-scripts
    namespace: ai   # must match the Deployment's namespace or the hashed name is not propagated
    files:
      - server.py
      - setup.sh
      - requirements-torch.txt
      - requirements.txt
