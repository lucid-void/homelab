---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-backup-script
  namespace: ai
data:
  backup.sh: |
    #!/usr/bin/env bash
    # Generic PVC backup: optionally scale deployments to 0, restic everything under /data
    # to its own repo on Filen, scale back up. Driven by BACKUP_NAME, NAMESPACE and
    # SCALE_DOWN (space-separated deployment names, may be empty) from the CronJob.
    set -euo pipefail

    LOG=/tmp/backup.log
    exec > >(tee "$LOG") 2>&1

    notify_gotify() {
      local title="$1" msg="$2" priority="${3:-5}"
      [[ -n "${GOTIFY_TOKEN:-}" ]] || { echo "[backup] no GOTIFY_TOKEN; not notified"; return 0; }
      curl -sf -X POST "http://gotify.monitoring.svc.cluster.local/message" \
        -H "Content-Type: application/json" \
        -H "X-Gotify-Key: ${GOTIFY_TOKEN}" \
        -d "{\"title\":\"${title}\",\"message\":\"${msg}\",\"priority\":${priority}}" \
        >/dev/null || true
    }

    cleanup() {
      local exit_code=$?
      for d in ${SCALE_DOWN:-}; do
        echo "[backup] Scaling ${d} back to 1 replica..."
        kubectl scale "deployment/${d}" -n "${NAMESPACE}" --replicas=1 || true
      done
      if [[ ${exit_code} -eq 0 ]]; then
        notify_gotify "Backup: ${BACKUP_NAME} ✓" "Completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      else
        local tail_log
        tail_log=$(tail -10 "$LOG" 2>/dev/null | awk '{gsub(/\\/, "\\\\"); gsub(/"/, "\\\""); gsub(/[[:cntrl:]]/, " "); printf "%s\\n", $0}')
        notify_gotify "Backup: ${BACKUP_NAME} ✗" "Exit ${exit_code} at $(date -u +%Y-%m-%dT%H:%M:%SZ)\n\n${tail_log}" 8
      fi
    }
    trap cleanup EXIT

    echo "[backup] Starting ${BACKUP_NAME} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

    # restic-secret is mirrored from the media namespace by Reflector and carries the
    # Minecraft repo path. The CronJob overrides RESTIC_REPOSITORY; if that override is ever
    # lost, stop here rather than write into (and prune) another job's repository.
    expected="rclone:filen:backups/restic/${BACKUP_NAME}"
    if [[ "${RESTIC_REPOSITORY:-}" != "${expected}" ]]; then
      echo "[backup] RESTIC_REPOSITORY is not ${expected}; refusing to run"
      exit 1
    fi

    for d in ${SCALE_DOWN:-}; do
      echo "[backup] Scaling down ${d}..."
      kubectl scale "deployment/${d}" -n "${NAMESPACE}" --replicas=0
    done
    for d in ${SCALE_DOWN:-}; do
      kubectl rollout status "deployment/${d}" -n "${NAMESPACE}" --timeout=120s
    done

    # rc=10 is the only "repo is missing" answer; a Filen blip must not read as one.
    repo_rc=0
    restic cat config >/dev/null || repo_rc=$?
    if [[ ${repo_rc} -eq 10 ]]; then
      echo "[backup] Initialising new restic repository on Filen..."
      restic init
    elif [[ ${repo_rc} -ne 0 ]]; then
      exit "${repo_rc}"
    fi

    # Clear a stale lock left by a job killed mid-run. Safe only because this repo has
    # exactly one job and the CronJob is concurrencyPolicy: Forbid — see
    # design/decisions/backups.md.
    restic unlock --remove-all

    echo "[backup] Running restic backup..."
    restic backup /data \
      --tag "$(date +%Y-%m-%d)" \
      --tag "${BACKUP_NAME}" \
      --verbose

    # --group-by '' is load-bearing: see design/decisions/backups.md.
    echo "[backup] Pruning old snapshots..."
    restic forget --group-by '' --keep-daily 30 --keep-monthly 12 --prune

    echo "[backup] Checking repository integrity..."
    restic check --read-data-subset=1/10

    echo "[backup] Done at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
