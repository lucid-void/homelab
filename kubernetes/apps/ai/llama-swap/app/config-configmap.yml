---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: ai
data:
  config.yaml: |
    # Defaults to "proxy", which forwards only llama-swap's own request log and
    # SWALLOWS llama-server's. That hides the two things you actually need from
    # this pod: the "KV self size" line that tells you what --ctx-size costs in
    # memory, and any model-load failure — a bad GGUF or an out-of-memory abort
    # otherwise shows up as nothing at all in `kubectl logs`, just a request that
    # never returns. Found the hard way trying to size the context window.
    logToStdout: both

    models:
      qwen-smart:
        aliases: [default]
        # Never unload. Reloading 34 GiB off local disk is tens of seconds, and
        # nothing else on this node is competing for the memory.
        ttl: 0
        cmd: >
          /app/llama-server --host 0.0.0.0 --port ${PORT}
          --model /models/Qwen3.6-35B-A3B-Q8_0.gguf
          --threads 6 --ctx-size 32768
          --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on
          --jinja --metrics

      # NO --cache-reuse HERE, and it must not be re-added for this model.
      # It was in the first revision and llama-server threw it away at startup:
      #
      #   W srv load_model: cache_reuse is not supported by this context,
      #                     it will be disabled
      #
      # The guard is `if (!llama_memory_can_shift(...))` in server-context.cpp
      # — a property of this model's KV implementation, not something a flag can
      # turn on. A dead flag in git that reads as a performance optimisation is
      # worse than no flag: it invites someone to "explain" a slow prefill with
      # a setting that was never in effect.
      #
      # The live prefix-caching mechanism is llama-server's cross-request prompt
      # cache (--cache-ram), which is NOT gated by that check and is already on:
      # cache_ram_mib defaults to 8192 MiB. Left at the default deliberately —
      # but budget for it, it is 8 GiB of real memory.

      local-embed:
        ttl: 0
        cmd: >
          /app/llama-server --host 0.0.0.0 --port ${PORT}
          --model /models/nomic-embed-text-v1.5.Q8_0.gguf
          --embeddings --threads 2 --ctx-size 8192 --metrics

    # LOAD-BEARING. Both keys default to TRUE, so in the single default group
    # every embedding call from Open WebUI's RAG would unload the 34 GiB chat
    # model and reload it afterwards — a multi-second stall on each document
    # chunk, with nothing in the logs that names the cause.
    #
    #   swap: false      -> members may run simultaneously
    #   exclusive: false -> running a member does not unload other groups
    #
    # Do not also add a top-level `routing:` block. It is the newer canonical
    # form of this same config and llama-swap rejects a file that uses both.
    groups:
      chat:
        swap: false
        exclusive: false
        members: [qwen-smart]
      embed:
        swap: false
        exclusive: false
        members: [local-embed]
