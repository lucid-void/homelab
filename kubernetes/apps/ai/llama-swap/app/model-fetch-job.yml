---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-fetch
  namespace: ai
  annotations:
    # Complementary to failedJobsHistoryLimit rather than conflicting with it —
    # whichever fires first removes the Job. Same rationale as every other Job
    # here; see .claude/CLAUDE.md.
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: >-
      TTL and history limits are complementary; the strictest wins and that is
      intended.
    # Root is required so the downloaded weights are owned by the uid that reads
    # them: the llama-swap :cpu image runs as root, and a mismatch would leave a
    # 34 GiB file the server cannot open. A non-root variant of both exists and
    # is worth moving to, but only after checking how the openebs helper pod
    # leaves the hostpath directory's ownership.
    ignore-check.kube-linter.io/run-as-non-root: "weights must be owned by the uid llama-swap runs as"
spec:
  ttlSecondsAfterFinished: 86400
  # ~35 GiB. At 50 MB/s that is ~12 minutes; at 5 MB/s it is closer to two hours.
  # 6h is a bound against a stalled transfer, not a performance target — without
  # one, a hung curl leaves the pod Running with no output and nothing retries.
  activeDeadlineSeconds: 21600
  # Unlike the backup CronJobs (backoffLimit: 0, where a retry re-enters a
  # scale-down cycle), retrying a download is free and the common failure is a
  # transient CDN error. curl resumes from the .part file.
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      # openebs-hostpath is node-local: this Job must write the same directory
      # the llama-swap Deployment reads.
      nodeSelector:
        kubernetes.io/hostname: llm-1
      tolerations:
        - key: workload
          operator: Equal
          value: llm
          effect: NoSchedule
      # Root, matching the llama-swap :cpu image, so the weights are owned by the
      # uid that reads them. The alternative (a non-root uid plus fsGroup) is
      # worth doing later, but only after verifying how the openebs helper pod
      # leaves the hostpath directory's ownership — not on an assumption.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: fetch
          # backup-tools bundles bash + curl, which is the whole dependency set.
          # No `apk add` at container start: an unbounded install is what wedged
          # three bootstrap Jobs for days in August 2026.
          image: ghcr.io/lucid-void/backup-tools:v1.1.0
          command: ["/bin/bash", "/scripts/fetch-models.sh"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 500m
            limits:
              memory: 512Mi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
        # Generated by configMapGenerator, so the name carries a content hash.
        # Editing fetch-models.sh therefore changes this pod spec, which is what
        # drives the re-run — see kustomization.yml.
        - name: script
          configMap:
            name: model-fetch-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
