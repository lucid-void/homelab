---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app couchdb
  namespace: flux-system
spec:
  targetNamespace: obsidian
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # openebs-hostpath, not nfs-client: CouchDB fsyncs on every write and the
    # NFS/fsync-locking trap is already documented for RomM's valkey and the
    # gitea valkey TODO.
    - name: openebs
    - name: shared-gateway
    - name: sealed-secrets
  path: ./kubernetes/apps/obsidian/couchdb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 10m
