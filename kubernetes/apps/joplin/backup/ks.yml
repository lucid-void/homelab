---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app joplin-backup
  namespace: flux-system
spec:
  targetNamespace: joplin
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: joplin
    - name: joplin-database
    - name: sealed-secrets
  path: ./kubernetes/apps/joplin/backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 5m
