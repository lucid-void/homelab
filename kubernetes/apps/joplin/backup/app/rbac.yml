---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: joplin-backup
  namespace: joplin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: joplin-backup
  namespace: joplin
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["joplin"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["joplin"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: joplin-backup
  namespace: joplin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: joplin-backup
subjects:
  - kind: ServiceAccount
    name: joplin-backup
    namespace: joplin
