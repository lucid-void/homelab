---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app joplin
  namespace: flux-system
spec:
  targetNamespace: joplin
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: joplin-database
    - name: shared-gateway
    - name: sealed-secrets
    - name: zitadel-bootstrap
  path: ./kubernetes/apps/joplin/joplin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 10m
