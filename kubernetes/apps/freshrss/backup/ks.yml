---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app freshrss-backup
  namespace: flux-system
spec:
  targetNamespace: freshrss
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: freshrss
  path: ./kubernetes/apps/freshrss/backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 5m
