---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: postgres
  annotations:
    # deliberate: the TTL and the history limits are complementary here, not
    # conflicting. Whichever fires first removes the Job, and three runs of a
    # daily job cannot accumulate inside 24h -- so the TTL always wins and the
    # limits remain a cap. Without it a failed Job lingers until three MORE
    # failures evict it, re-firing KubeJobFailed indefinitely.
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "deliberate - see comment"
    # restic and rclone need a writable HOME for their cache
    ignore-check.kube-linter.io/no-read-only-root-fs: "restic/rclone cache"
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      # Self-clean after 24h. failedJobsHistoryLimit alone retains a failed
      # Job until three MORE failures evict it, so one rare failure leaves the
      # object sitting there and KubeJobFailed re-fires ~twice a day forever
      # (minecraft-backup did exactly this for 7 days, 2026-08-20 to 08-28).
      # Nothing is lost: the script's own Gotify ✗ notification carries the
      # log tail and persists in Gotify independently of this object.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
          volumes:
            - name: db-dump
              emptyDir: {}
            - name: rclone-config
              secret:
                secretName: rclone-secret
                defaultMode: 0440
            - name: script
              configMap:
                name: postgres-backup-script
                defaultMode: 0755
            - name: databases
              configMap:
                name: postgres-backup-databases
          containers:
            - name: backup
              image: ghcr.io/lucid-void/backup-tools:v1.1.0
              command: ["/bin/bash", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: restic-secret
                - secretRef:
                    name: gotify-secret
                    optional: true
              env:
                - name: PGHOST
                  value: postgres-ro.postgres.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-superuser
                      key: password
                - name: RCLONE_CONFIG
                  value: /rclone-config/rclone.conf
              volumeMounts:
                - name: db-dump
                  mountPath: /db
                - name: rclone-config
                  mountPath: /rclone-config
                  readOnly: true
                - name: script
                  mountPath: /scripts
                - name: databases
                  mountPath: /config
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 1Gi
