---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-script
  namespace: postgres
data:
  backup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    LOG=/tmp/backup.log
    exec > >(tee "$LOG") 2>&1

    notify_gotify() {
      local title="$1" msg="$2" priority="${3:-5}"
      curl -sf -X POST "http://gotify.monitoring.svc.cluster.local/message" \
        -H "Content-Type: application/json" \
        -H "X-Gotify-Key: ${GOTIFY_TOKEN}" \
        -d "{\"title\":\"${title}\",\"message\":\"${msg}\",\"priority\":${priority}}" \
        >/dev/null || true
    }

    on_exit() {
      local exit_code=$?
      if [[ ${exit_code} -eq 0 ]]; then
        notify_gotify "Backup: postgres ✓" "Completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      else
        local tail_log
        tail_log=$(tail -10 "$LOG" 2>/dev/null | awk '{gsub(/\\/, "\\\\"); gsub(/"/, "\\\""); printf "%s\\n", $0}')
        notify_gotify "Backup: postgres ✗" "Exit ${exit_code} at $(date -u +%Y-%m-%dT%H:%M:%SZ)\n\n${tail_log}" 8
      fi
    }
    trap on_exit EXIT

    echo "[postgres-backup] Starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

    mkdir -p /db

    # Dump each database to a separate file.
    # pg_dump from the read replica uses a consistent transaction snapshot
    # (PostgreSQL MVCC) — no service quiescing needed.
    while IFS= read -r dbname; do
      [[ -z "${dbname}" ]] && continue
      echo "[postgres-backup] Dumping ${dbname}..."
      pg_dump --format=custom --file="/db/${dbname}.pgdump" "${dbname}"
      echo "[postgres-backup] ${dbname}: $(du -sh /db/${dbname}.pgdump | cut -f1)"
    done < /config/databases

    # Init restic repo on Filen if this is the first run
    restic cat config &>/dev/null || restic init

    # Clear a stale lock left by a job killed mid-run (OOM, node reboot, deadline).
    # restic only auto-expires a lock it can prove is dead, which needs the lock's
    # hostname to match this host — every Job pod is a new hostname, so a dead lock
    # never self-heals and blocks every following night at rc=11. Plain `unlock` will
    # not clear it; --remove-all will. Safe only because this repo has exactly one job
    # and the CronJob is concurrencyPolicy: Forbid — see design/decisions/backups.md.
    restic unlock --remove-all

    # All database dumps in a single restic snapshot.
    # Restic deduplicates — only new or changed chunks are uploaded.
    restic backup /db/ \
      --tag "$(date +%Y-%m-%d)" \
      --tag postgres \
      --verbose

    # Keep 30 daily then 12 monthly snapshots; prune orphaned pack files from Filen
    #    --group-by '' is load-bearing: restic defaults to --group-by host,paths,
    #    and every Job pod has a unique hostname, so each snapshot formed a group
    #    of one that --keep-daily 30 then trivially kept. Nothing was ever pruned
    #    (73 snapshots survived in a 30-day repo). One restic repo per job here,
    #    so there is nothing to group by at all.
    restic forget --group-by '' --keep-daily 30 --keep-monthly 12 --prune

    # Spot-check: verify 1/10th of repository data
    restic check --read-data-subset=1/10

    echo "[postgres-backup] Done at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
