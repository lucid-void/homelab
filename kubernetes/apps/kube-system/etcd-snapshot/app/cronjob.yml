---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: kube-system
  annotations:
    # deliberate: the TTL and the history limits are complementary here, not
    # conflicting. Whichever fires first removes the Job, and three runs of a
    # daily job cannot accumulate inside 24h -- so the TTL always wins and the
    # limits remain a cap. Without it a failed Job lingers until three MORE
    # failures evict it, re-firing KubeJobFailed indefinitely.
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "deliberate - see comment"
    # downloads talosctl at runtime into the container filesystem
    ignore-check.kube-linter.io/no-read-only-root-fs: "runtime talosctl download"
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      # Self-clean after 24h. failedJobsHistoryLimit alone retains a failed
      # Job until three MORE failures evict it, so one rare failure leaves the
      # object sitting there and KubeJobFailed re-fires ~twice a day forever
      # (minecraft-backup did exactly this for 7 days, 2026-08-20 to 08-28).
      # Nothing is lost: the script's own Gotify ✗ notification carries the
      # log tail and persists in Gotify independently of this object.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: etcd-snapshot
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
          volumes:
            - name: rclone-config
              secret:
                secretName: rclone-secret
                defaultMode: 0440
            - name: talosconfig
              secret:
                secretName: talosconfig-secret
                defaultMode: 0440
            - name: script
              configMap:
                name: etcd-snapshot-script
                defaultMode: 0755
          containers:
            - name: backup
              image: ghcr.io/lucid-void/backup-tools:v1.1.0
              command: ["/bin/bash", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: restic-secret
                - secretRef:
                    name: gotify-secret
                    optional: true
              env:
                - name: RCLONE_CONFIG
                  value: /rclone-config/rclone.conf
              volumeMounts:
                - name: rclone-config
                  mountPath: /rclone-config
                  readOnly: true
                - name: talosconfig
                  mountPath: /talosconfig
                  readOnly: true
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 512Mi
