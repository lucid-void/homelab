---
apiVersion: apps.projectsveltos.io/v1alpha1
kind: Cleaner
metadata:
  name: succeeded-pods
spec:
  schedule: "0 */6 * * *"
  resourcePolicySet:
    resourceSelectors:
      - kind: Pod
        group: ""
        version: v1
    # NOTE: each entry must be wrapped as `{resource = <obj>}`, NOT the bare
    # object. The controller unmarshals the returned `resources` array into
    # []ResourceResult{ Resource *unstructured.Unstructured `json:"resource"` },
    # so a bare object leaves Resource nil and the controller segfaults on
    # GetKind() (executor/worker.go:721). The loop only runs when the list is
    # non-empty, so a wrong shape crashes *only when there is something to
    # delete* — it looks healthy right up until it is needed.
    aggregatedSelection: |
      function evaluate(resources)
        local toDelete = {}
        for _, resource in ipairs(resources) do
          if resource.status ~= nil and resource.status.phase == "Succeeded" then
            table.insert(toDelete, {resource = resource})
          end
        end
        return {resources = toDelete}
      end
  action: Delete
---
apiVersion: apps.projectsveltos.io/v1alpha1
kind: Cleaner
metadata:
  name: failed-pods
spec:
  schedule: "30 */6 * * *"
  resourcePolicySet:
    resourceSelectors:
      - kind: Pod
        group: ""
        version: v1
    # See the note on succeeded-pods above — entries must be `{resource = <obj>}`.
    aggregatedSelection: |
      function evaluate(resources)
        local toDelete = {}
        for _, resource in ipairs(resources) do
          if resource.status ~= nil and resource.status.phase == "Failed" then
            table.insert(toDelete, {resource = resource})
          end
        end
        return {resources = toDelete}
      end
  action: Delete
