---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-cleaner
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-cleaner
      version: "0.23.0"
      sourceRef:
        kind: HelmRepository
        name: k8s-cleaner
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Path is `controller.resources`, NOT a top-level `resources`. The chart
    # renders no error for the wrong key -- it just drops it, and the container
    # comes up with `resources: {}`. This block sat at the top level from
    # creation and was a silent no-op the whole time (found 2026-08-29 by
    # diffing declared requests against the live pod spec); the request below is
    # therefore the first one that actually applies. Verify a change landed with
    # `kubectl get pod -n kube-system -l app.kubernetes.io/name=k8s-cleaner \
    #   -o jsonpath='{.items[*].spec.containers[*].resources}'` rather than
    # trusting that Flux reconciled cleanly.
    #
    # Memory sized from a 30d VictoriaMetrics window: p90 105, peak 139 MiB.
    controller:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
