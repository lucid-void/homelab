---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-backup-script
  namespace: media
data:
  backup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    LOG=/tmp/backup.log
    exec > >(tee "$LOG") 2>&1

    notify_gotify() {
      local title="$1" msg="$2" priority="${3:-5}"
      curl -sf -X POST "http://gotify.monitoring.svc.cluster.local/message" \
        -H "Content-Type: application/json" \
        -H "X-Gotify-Key: ${GOTIFY_TOKEN}" \
        -d "{\"title\":\"${title}\",\"message\":\"${msg}\",\"priority\":${priority}}" \
        >/dev/null || true
    }

    cleanup() {
      local exit_code=$?
      if [[ ${exit_code} -eq 0 ]]; then
        notify_gotify "Backup: minecraft ✓" "Completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      else
        local tail_log
        tail_log=$(tail -10 "$LOG" 2>/dev/null | awk '{gsub(/\\/, "\\\\"); gsub(/"/, "\\\""); printf "%s\\n", $0}')
        notify_gotify "Backup: minecraft ✗" "Exit ${exit_code} at $(date -u +%Y-%m-%dT%H:%M:%SZ)\n\n${tail_log}" 8
      fi
    }
    trap cleanup EXIT

    echo "[backup] Starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

    # No quiescing here, and no scale-down. The mc-backup sidecars already produce
    # RCON-quiesced tarballs on this NFS volume every 2h, so each file is a
    # consistent point-in-time world. Copying a live world directory instead would
    # yield torn region files that only fail at restore time.
    if [[ -z "$(find /backups -type f -name '*.tgz' -o -type f -name '*.tar*' 2>/dev/null | head -1)" ]]; then
      echo "[backup] ERROR: no tarballs found under /backups — mc-backup sidecars have not produced anything yet"
      exit 1
    fi

    echo "[backup] Archive inventory:"
    du -sh /backups/* 2>/dev/null || true

    # Init restic repo on Filen if this is the first run
    if ! restic cat config &>/dev/null; then
      echo "[backup] Initialising new restic repository on Filen..."
      restic init
    fi

    # restic is content-addressable, so re-uploading the same tarballs each night
    # costs almost nothing — only the newest archives are actually transferred.
    echo "[backup] Running restic backup..."
    restic backup /backups \
      --tag "$(date +%Y-%m-%d)" \
      --tag minecraft \
      --verbose

    echo "[backup] Pruning old snapshots..."
    restic forget --keep-daily 30 --prune

    echo "[backup] Checking repository integrity..."
    restic check --read-data-subset=1/10

    echo "[backup] Done at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
