---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-backup
  namespace: media
spec:
  # 07:00 — after the existing fleet (homebox 02:00 … joplin 06:00) so the Filen
  # uploads don't overlap.
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          # No podAffinity needed: mc-backups is RWX, unlike joplin/homebox whose
          # jobs have to land on the app's node to share an RWO volume.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mc-backups
                readOnly: true
            - name: rclone-config
              secret:
                secretName: rclone-secret
                defaultMode: 0440
            - name: script
              configMap:
                name: minecraft-backup-script
                defaultMode: 0755
          containers:
            - name: backup
              image: ghcr.io/lucid-void/backup-tools:v1.0.2
              command: ["/bin/bash", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: restic-secret
                - secretRef:
                    name: gotify-secret
                    optional: true
              env:
                - name: RCLONE_CONFIG
                  value: /rclone-config/rclone.conf
              volumeMounts:
                - name: backups
                  mountPath: /backups
                  readOnly: true
                - name: rclone-config
                  mountPath: /rclone-config
                  readOnly: true
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 1Gi
