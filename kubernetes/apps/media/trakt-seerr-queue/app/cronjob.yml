---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trakt-seerr-queue
  namespace: media
spec:
  # The watchlist is edited by hand on a phone; 30m is well inside the latency
  # anyone would notice, and keeps Trakt API calls to 96/day.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 2202
            runAsGroup: 2200
            fsGroup: 2200
            runAsNonRoot: true
          volumes:
            - name: script
              configMap:
                name: trakt-seerr-queue-script
                defaultMode: 0755
            - name: state
              persistentVolumeClaim:
                claimName: trakt-queue-state
          containers:
            - name: queue
              image: python:3.13-alpine
              command: ["python3", "/scripts/queue.py"]
              envFrom:
                # No `optional: true` — chart 3.7.3 strips it, and a missing
                # secret here would fail with a bare KeyError.
                - secretRef:
                    name: trakt-queue-secrets
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: state
                  mountPath: /state
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 256Mi
