---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minecraft-events
  namespace: media
---
# Namespaced Role, not a ClusterRole: the watcher only ever reads one pod's log
# in `media`. pods/log is a read of everything the proxy prints, so keep it
# scoped as tightly as the job allows.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minecraft-events
  namespace: media
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # list to resolve the proxy pod by label after every restart; get is what
    # `kubectl logs` itself issues before opening the stream.
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minecraft-events
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minecraft-events
subjects:
  - kind: ServiceAccount
    name: minecraft-events
    namespace: media
