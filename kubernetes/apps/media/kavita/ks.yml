---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kavita
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: media-nfs
    - name: shared-gateway
  path: ./kubernetes/apps/media/kavita/app
  prune: true
  # kavita-bootstrap is a Job and a Job's pod template is immutable, so any edit to
  # the inline script fails the dry-run with "field is immutable" while the old Job
  # is still inside its ttlSecondsAfterFinished window. See design/decisions/flux.md.
  force: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 10m
