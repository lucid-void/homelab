---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-config-backup
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-config-backup
  namespace: media
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["crosswatch", "kavita", "prowlarr", "sabnzbd", "seerr", "suwayomi-app"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["crosswatch", "kavita", "prowlarr", "sabnzbd", "seerr", "suwayomi-app"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-config-backup
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-config-backup
subjects:
  - kind: ServiceAccount
    name: media-config-backup
    namespace: media
