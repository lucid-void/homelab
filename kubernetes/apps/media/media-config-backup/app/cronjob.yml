---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-config-backup
  namespace: media
  annotations:
    # deliberate: the TTL always wins for a daily job, and the history limits remain a
    # cap. See design/decisions/backups.md.
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "deliberate - see comment"
    # restic and rclone need a writable HOME for their cache
    ignore-check.kube-linter.io/no-read-only-root-fs: "restic/rclone cache"
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: media-config-backup
          restartPolicy: Never
          # No podAffinity: the ten apps run on different nodes. The nfs-client CSI driver has
          # attachRequired: false, so an RWO claim is not pinned to one node.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2202
            runAsGroup: 2200
            fsGroup: 2200
          volumes:
            - name: crosswatch-config
              persistentVolumeClaim:
                claimName: crosswatch-config
                readOnly: true
            - name: kavita-config
              persistentVolumeClaim:
                claimName: kavita-config
                readOnly: true
            - name: prowlarr-config
              persistentVolumeClaim:
                claimName: prowlarr-config
                readOnly: true
            - name: radarr-config
              persistentVolumeClaim:
                claimName: radarr-config
                readOnly: true
            - name: romm-config
              persistentVolumeClaim:
                claimName: romm-config
                readOnly: true
            - name: sabnzbd-config
              persistentVolumeClaim:
                claimName: sabnzbd-config
                readOnly: true
            - name: seerr-config
              persistentVolumeClaim:
                claimName: seerr-config
                readOnly: true
            - name: sonarr-config
              persistentVolumeClaim:
                claimName: sonarr-config
                readOnly: true
            - name: suwayomi-config
              persistentVolumeClaim:
                claimName: suwayomi-config
                readOnly: true
            - name: tdarr-config
              persistentVolumeClaim:
                claimName: tdarr-config
                readOnly: true
            - name: rclone-config
              secret:
                secretName: rclone-secret
                defaultMode: 0440
            - name: script
              configMap:
                name: media-config-backup-script
                defaultMode: 0755
          containers:
            - name: backup
              image: ghcr.io/lucid-void/backup-tools:v1.1.0
              command: ["/bin/bash", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: restic-secret
              env:
                # Overrides the RESTIC_REPOSITORY inside restic-secret, which is the
                # Minecraft repo: the secret is shared, the repository is not.
                - name: RESTIC_REPOSITORY
                  value: rclone:filen:backups/restic/media-config-backup
                - name: BACKUP_NAME
                  value: media-config-backup
                - name: NAMESPACE
                  value: media
                - name: SCALE_DOWN
                  value: "crosswatch kavita prowlarr sabnzbd seerr suwayomi-app"
                - name: RCLONE_CONFIG
                  value: /rclone-config/rclone.conf
                - name: HOME
                  value: /tmp
                - name: GOTIFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: media-config-backup-gotify-secret
                      key: GOTIFY_TOKEN
                      optional: true
              volumeMounts:
                - name: crosswatch-config
                  mountPath: /data/crosswatch
                  readOnly: true
                - name: kavita-config
                  mountPath: /data/kavita
                  readOnly: true
                - name: prowlarr-config
                  mountPath: /data/prowlarr
                  readOnly: true
                - name: radarr-config
                  mountPath: /data/radarr
                  readOnly: true
                - name: romm-config
                  mountPath: /data/romm
                  readOnly: true
                - name: sabnzbd-config
                  mountPath: /data/sabnzbd
                  readOnly: true
                - name: seerr-config
                  mountPath: /data/seerr
                  readOnly: true
                - name: sonarr-config
                  mountPath: /data/sonarr
                  readOnly: true
                - name: suwayomi-config
                  mountPath: /data/suwayomi
                  readOnly: true
                - name: tdarr-config
                  mountPath: /data/tdarr
                  readOnly: true
                - name: rclone-config
                  mountPath: /rclone-config
                  readOnly: true
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 1Gi
