---
# Message bus for QuickChat's cross-server sync. The two Minecraft servers are
# independent JVMs with separate worlds; chat, /msg, staffchat and join/leave
# messages cross between them by being published here and picked up by the other
# server. Velocity does NOT merge chat on its own — this is what actually makes
# multi-server chat work.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-valkey
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      app:
        replicas: 1
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: 8.1-alpine
            # Pure pub/sub relay for live chat — there is nothing worth keeping
            # across a restart, and a message that arrives while a server is
            # down is stale anyway. Both persistence mechanisms are disabled so
            # this can never try to fsync, which is exactly the trap RomM's
            # embedded valkey hit on NFS.
            args:
              - valkey-server
              - --save
              - ""
              - --appendonly
              - "no"
              - --maxmemory
              - 64mb
              - --maxmemory-policy
              - allkeys-lru
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["valkey-cli", "ping"]
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["valkey-cli", "ping"]
                  initialDelaySeconds: 5
                  periodSeconds: 15
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 128Mi

    service:
      app:
        controller: app
        ports:
          valkey:
            port: 6379

    persistence:
      # In-memory only; see the args above.
      data:
        type: emptyDir
        advancedMounts:
          app:
            app:
              - path: /data
