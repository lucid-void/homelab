---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matcha
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      app:
        replicas: 1
        # RWO volume: a RollingUpdate would deadlock (new pod pending on a PVC the
        # old pod still holds). Also matters because two Minecraft processes on one
        # world directory corrupt it — session.lock is not a substitute.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Default is 30s, which is not enough for a Minecraft server to flush a
          # sizeable world — the kubelet would SIGKILL mid-save. Must exceed
          # STOP_DURATION so mc-server-runner finishes first.
          terminationGracePeriodSeconds: 120
          securityContext:
            # Media-stack convention. The itzg entrypoint starts as root, chowns
            # /data to UID/GID below, then drops privileges itself — so no
            # runAsUser here, or that chown never happens.
            fsGroup: 2200
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # filebrowser stores users in its bolt DB, and a fresh DB otherwise gets a
          # random admin password printed once to stdout. Create/refresh the admin
          # account deterministically from the SealedSecret instead. Idempotent:
          # `users add` fails when the account exists, so fall through to `update`.
          filebrowser-init:
            image:
              repository: filebrowser/filebrowser
              tag: v2.63.23
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                DB=/database/filebrowser.db
                filebrowser config init --database "$DB" --root /srv --auth.method=json || true
                filebrowser config set --database "$DB" --root /srv --auth.method=json
                filebrowser users add admin "$FB_ADMIN_PASSWORD" \
                  --database "$DB" --perm.admin 2>/dev/null \
                  || filebrowser users update admin --database "$DB" \
                       --password "$FB_ADMIN_PASSWORD" --perm.admin
                echo "filebrowser admin account ready"
            # Non-optional secretRef: app-template strips secretRef.optional on
            # initContainers, and there is no secretKeyRef support here.
            envFrom:
              - secretRef:
                  name: minecraft-secret
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
        containers:
          app:
            image:
              repository: itzg/minecraft-server
              tag: 2026.8.2-java25
            env:
              EULA: "TRUE"
              TZ: Europe/Brussels
              UID: "2202"
              GID: "2200"
              TYPE: PAPER
              # Minecraft switched to calendar versioning; 26.2 is the current
              # release and Paper builds for it. Pin deliberately — a world opened
              # by a newer version cannot be downgraded.
              VERSION: "26.2"
              MEMORY: 6G
              USE_AIKAR_FLAGS: "true"
              MOTD: "matcha"
              DIFFICULTY: normal
              # Biggest single lever on chunk I/O and tick cost. Raise only if the
              # server is comfortably idle.
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "6"
              # Velocity terminates the Mojang session check and forwards the
              # verified identity. This is only safe because the velocity patch
              # below makes Paper *reject* any login without a valid signature —
              # so despite online-mode being off, this server cannot be joined
              # directly, and its Service is ClusterIP-only regardless.
              ONLINE_MODE: "FALSE"
              # Patches proxies.velocity.* into the generated paper-global.yml
              # each boot. See patches-configmap.yml for why this is a patch and
              # not a whole mounted file.
              PATCH_DEFINITIONS: /patches
              # Unique per server — QuickChat keys its cross-server routing
              # on this, so two servers sharing an id break the bridge.
              CFG_QUICKCHAT_SERVER_ID: "matcha"
              CFG_VELOCITY_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: velocity-secret
                    key: CFG_VELOCITY_SECRET
              ENABLE_ROLLING_LOGS: "true"
              ENABLE_RCON: "true"
              RCON_PORT: "25575"
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-secret
                    key: RCON_PASSWORD
              # Plugins are declared here rather than uploaded, so the server's
              # plugin set is reproducible from git and survives losing the PVC.
              # Slugs are Modrinth project IDs; SPIGET_RESOURCES takes SpigotMC
              # numeric resource IDs if you need something not on Modrinth.
              #
              # Check `loaders` on the Modrinth project before adding one — a slug
              # resolving for fabric/forge does NOT mean a Paper build exists, and
              # an unresolvable project fails startup. `spark` was dropped here for
              # exactly that reason: it publishes only mod-loader builds to
              # Modrinth, no paper/bukkit. All of the below list paper + 26.2.
              #
              #   luckperms — permissions
              #   chunky    — offline terrain pregeneration. Worth having on any
              #               world here: generation is the expensive random I/O,
              #               and doing it up front turns play-time chunk loads
              #               into plain reads. Pregen AFTER any worldgen datapack.
              #   squaremap — live web map, served on 8080 (see the `map` Service)
              #   quickchat — cross-server chat. Velocity does NOT merge chat
              #               between backends; this plugin does, by relaying
              #               through minecraft-valkey. Must be installed on
              #               BOTH servers or the bridge is one-way.
              #   placeholderapi — hard dependency of quickchat (declared in its
              #               plugin.yml, NOT in Modrinth metadata, so
              #               MODRINTH_DOWNLOAD_DEPENDENCIES does not pull it;
              #               without it Quickchat fails to load with
              #               UnknownDependencyException and chat stays local).
              #   jeirecipefix — re-sends the server's recipe set to JEI/REI/EMI.
              #               Since MC 1.21.2 the server no longer sends recipe
              #               data to clients: it sends recipe-book *displays*
              #               only, and only for recipes that player has already
              #               unlocked — so a recipe viewer on a plugin server
              #               shows nothing. That is a vanilla protocol change,
              #               not a Paper bug, and JEI's own answer ("install JEI
              #               on the server") is impossible here because JEI is a
              #               mod and Paper takes plugins. It has to be fixed
              #               server-side. Matters most on matcha: Matcha
              #               Flavoured's recipes are *datapack* recipes, which
              #               never reach the client at all, so the client-side
              #               workaround (client-recipe-fix) cannot help — it
              #               only restores vanilla ones. Do NOT substitute the
              #               more popular `jei-recipe-bridge`: it stops at
              #               26.1.2 and would fail to resolve on 26.2.
              MODRINTH_PROJECTS: "luckperms,placeholderapi,chunky,squaremap,quickchatv2,jeirecipefix"
              MODRINTH_DOWNLOAD_DEPENDENCIES: required

              # World directory name. Previously lived only in server.properties on
              # the PVC, where it drifted to point at a half-migrated stub and
              # crash-looped the server. Driving it from here means itzg rewrites
              # server.properties on every boot, so a bad manual edit self-heals.
              LEVEL: matcha

              # Matcha Flavoured is a *combined* pack: the same zip carries both
              # data/ (server-side recipes, advancements, worldgen) and assets/
              # (client-side custom sounds and textures), so it is installed twice —
              # as a datapack the server loads, and as a resource pack pushed to
              # clients. Modrinth labels it loaders=datapack; that describes their
              # categorisation, not the zip's contents.
              DATAPACKS: &pack "https://cdn.modrinth.com/data/QI0EmgZ1/versions/E9rngRfK/Matcha_Flavoured_1_12.zip"
              # Clear superseded versions on a bump, so two copies of the pack are
              # never loaded at once.
              REMOVE_OLD_DATAPACKS: "true"

              RESOURCE_PACK: *pack
              # Must match the file byte-for-byte — a wrong value fails the
              # `server_resource_pack` configuration task and disconnects every
              # client mid-join ("Unexpected error during configuration"), which is
              # exactly how vanilla broke. Re-derive it whenever the URL changes:
              #   curl -s https://api.modrinth.com/v2/version/<id> | jq -r .files[0].hashes.sha1
              RESOURCE_PACK_SHA1: "77d080d2fe207a886c8c784ac239dec54a213065"
              # false = clients that decline or fail the download still play.
              RESOURCE_PACK_ENFORCE: "false"
              # RESOURCE_PACK_ID deliberately unset: it is optional, and the server
              # derives a stable v3 UUID from the pack URL. Only worth setting to
              # keep the pack's identity fixed across a URL change.

              # Nobody is an operator otherwise (ops.json is empty), so no one can
              # run in-game commands. Resolved to a UUID at boot via PlayerDB.
              OPS: "KillerBurger"

              # Graceful shutdown: mc-server-runner traps SIGTERM, runs `stop`, and
              # waits for the world to flush. Must stay below the pod's
              # terminationGracePeriodSeconds below, or the kubelet SIGKILLs the JVM
              # mid-save and the newest chunks are lost.
              STOP_DURATION: "90"
            probes:
              # mc-health ships in the image and speaks the Minecraft ping protocol,
              # so it reports the server actually accepting connections rather than
              # just the JVM being up.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  # World generation on a first boot can run for many minutes.
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 90
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                memory: 6Gi
                cpu: 500m
              # Must exceed MEMORY (heap) by enough for metaspace, GC structures
              # and direct buffers, or the JVM gets OOMKilled at full heap.
              # MEMORY=6G means -Xmx6G, so a 6Gi limit is heap == ceiling with
              # nothing spare — the kill happens as the heap fills, not gradually.
              #
              # 9Gi, not 8Gi: itzg sets -Xms AND -Xmx from MEMORY, so the heap
              # commits to the full 6 GiB and never gives it back. With ~1.2 GiB
              # of non-heap overhead, steady-state RSS lands at ~7.2 GiB = 90%
              # of an 8Gi limit — i.e. the alert threshold is reached by design
              # once the heap fills. vanilla hit this first (2026-08-04) purely
              # because it got there sooner; matcha was on the same trajectory
              # at 86%. Keep the two servers identical.
              limits:
                memory: 9Gi

          # Local disk is fast but node-pinned, so it is not a backup. This sidecar
          # takes RCON-quiesced (save-off / save-all / save-on) tarballs onto NFS,
          # which the nightly minecraft-backup CronJob then ships to Filen.
          backup:
            image:
              repository: itzg/mc-backup
              tag: "2026.8.2"
            env:
              TZ: Europe/Brussels
              BACKUP_INTERVAL: "2h"
              INITIAL_DELAY: "5m"
              # Nothing changes on an empty server; skip those cycles entirely.
              PAUSE_IF_NO_PLAYERS: "true"
              PRUNE_BACKUPS_DAYS: "7"
              BACKUP_METHOD: tar
              SRC_DIR: /data
              DEST_DIR: /backups
              RCON_HOST: localhost
              RCON_PORT: "25575"
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-secret
                    key: RCON_PASSWORD
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
            resources:
              requests:
                memory: 64Mi
                cpu: 25m
              limits:
                memory: 512Mi

          # Web file manager over the server directory: datapacks into
          # world/datapacks, jars into plugins/, in-browser edits of
          # server.properties. Everything routine should still go through the env
          # vars above — this is for the one-offs those can't express.
          files:
            image:
              repository: filebrowser/filebrowser
              tag: v2.63.23
            args:
              - --database=/database/filebrowser.db
              - --root=/srv
              - --address=0.0.0.0
              - --port=8081
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
            probes:
              # Liveness only, deliberately. Any container's readiness gates Pod
              # readiness, which would pull the Service endpoint and cut players
              # off — a file manager hiccup must not take the game server offline.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: false
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 256Mi

          # Real world-size metrics. kubelet_volume_stats_* cannot provide this:
          # openebs-hostpath has no quota, so the kubelet reports the node's /var
          # for this PVC rather than the world. See world-size-configmap.yml.
          #
          # Mounted read-only and running as the unprivileged media UID -- it only
          # ever stats the tree. The scan is on a timer inside the exporter, so a
          # scrape never triggers disk I/O.
          world-size:
            image:
              repository: python
              tag: "3.13-alpine"
            command: ["python3", "-u", "/exporter/exporter.py"]
            env:
              SERVER_NAME: matcha
              WORLD_ROOT: /data
              METRICS_PORT: "9109"
              SCAN_INTERVAL_SECONDS: "300"
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
            probes:
              # Liveness only. Readiness here would gate Pod readiness, which
              # strips the game Service's endpoints -- a metrics sidecar must
              # never be able to disconnect players. Same reasoning as `files`.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9109
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: false
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 128Mi

    service:
      # Two services, so app-template suffixes both: matcha-app / matcha-files.
      app:
        controller: app
        # No routing annotation any more: Velocity resolves this Service by DNS
        # from its [servers] block, and picks it via [forced-hosts]. Adding a
        # server is now a HelmRelease plus two lines in velocity-config.yml.
        ports:
          minecraft:
            port: 25565
      files:
        controller: app
        # Both Services select the same pod, and pod readiness is all-or-nothing —
        # so a crash-looping game server would also strip this Service's endpoints,
        # taking the file manager offline exactly when it's needed to fix a bad
        # config or remove a broken jar. Disabling the `files` readiness probe is
        # not enough; this is the half that decouples them.
        publishNotReadyAddresses: true
        ports:
          http:
            # 8081, not 8080: squaremap's internal webserver binds 0.0.0.0:8080
            # and runs inside the server JVM, which shares this pod's network
            # namespace — both on 8080 and one fails to bind.
            port: 8081
      metrics:
        controller: app
        # Selector label for the VMServiceScrape. Deliberately NOT
        # app.kubernetes.io/name -- Flux commonMetadata rewrites that on every
        # resource in a Kustomization, so a scrape keyed off it silently matches
        # the wrong Services or none at all.
        labels:
          monitoring.blackcats.cc/scrape: minecraft-world-size
        # The game server's readiness must not gate metrics: a crash-looping or
        # starting server is exactly when world size matters most.
        publishNotReadyAddresses: true
        ports:
          metrics:
            port: 9109
      map:
        controller: app
        # squaremap only renders while the server is running, so there is no value
        # in publishing it when the pod is unready.
        ports:
          http:
            port: 8080

    persistence:
      data:
        existingClaim: matcha-data
        # Same volume, different mount point per container: the server wants /data,
        # filebrowser serves it from /srv.
        advancedMounts:
          app:
            app:
              - path: /data
            backup:
              - path: /data
                readOnly: true
            world-size:
              - path: /data
                readOnly: true
            files:
              - path: /srv
            filebrowser-init:
              - path: /srv
      # filebrowser's bolt DB. Kept out of the world tree but on the same volume,
      # so it needs no PVC of its own.
      fbdb:
        existingClaim: matcha-data
        advancedMounts:
          app:
            files:
              - path: /database
                subPath: .filebrowser
            filebrowser-init:
              - path: /database
                subPath: .filebrowser
      # The image entrypoint copies a default settings.json in here at startup, so
      # it has to be writable. All real configuration comes from the flags above.
      fbconfig:
        type: emptyDir
        advancedMounts:
          app:
            files:
              - path: /config
      patches:
        type: configMap
        name: minecraft-patches
        advancedMounts:
          app:
            app:
              - path: /patches
                readOnly: true
      backups:
        existingClaim: mc-backups
        advancedMounts:
          app:
            backup:
              - path: /backups
                subPath: matcha
      exporter:
        type: configMap
        name: minecraft-world-size
        advancedMounts:
          app:
            world-size:
              - path: /exporter
                readOnly: true
