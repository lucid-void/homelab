---
# Applied by itzg's PATCH_DEFINITIONS on every boot. Deliberately a *patch*
# rather than a mounted paper-global.yml: replacing the whole file would reset
# every other Paper setting (packet-limiter, spam-limiter, chunk options) to
# defaults, and those are generated per Paper version. This touches only the
# three keys that matter and leaves the rest alone.
#
# `${CFG_VELOCITY_SECRET}` is substituted from the env var of the same name,
# supplied by the `velocity-secret` SealedSecret (same value Velocity mounts as
# forwarding.secret). itzg restricts placeholders to REPLACE_ENV_VARIABLE_PREFIX,
# which defaults to CFG_ — hence the name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-patches
  namespace: media
data:
  # NOTE the shape: when PATCH_DEFINITIONS points at a *directory*, each file
  # must be a bare PatchDefinition (`file` / `ops` / `file-format`). The
  # `{"patches": [...]}` wrapper is the *patch-set* format and is only valid
  # when PATCH_DEFINITIONS names a single file. Getting this wrong is not a
  # silent no-op — mc-image-helper errors and the init script exits non-zero,
  # which crash-loops the server before Paper ever starts:
  #   Failed to load patch definitions from /patches: Unrecognized field
  #   "patches" (3 known properties: "file-format", "ops", "file")
  velocity-forwarding.json: |
    {
      "file": "/data/config/paper-global.yml",
      "ops": [
        {
          "$set": {
            "path": "$.proxies.velocity.enabled",
            "value": true
          }
        },
        {
          "$set": {
            "path": "$.proxies.velocity.online-mode",
            "value": true
          }
        },
        {
          "$set": {
            "path": "$.proxies.velocity.secret",
            "value": "${CFG_VELOCITY_SECRET}"
          }
        }
      ]
    }
  # Turns on QuickChat's Redis bridge so chat, /msg, staffchat and join/leave
  # cross between matcha and vanilla. Velocity does NOT do this itself.
  #
  # `server-id` MUST be unique per server ("Must be unique across all servers in
  # the network"), so it comes from CFG_QUICKCHAT_SERVER_ID, set per HelmRelease
  # — that keeps this one ConfigMap shared by both servers instead of needing a
  # near-duplicate per server.
  #
  # Caveat: this patches a file the plugin generates, so it only works once
  # QuickChat has booted at least once and written redis.yml. On a rebuilt PVC
  # the first boot has no file to patch — check the init log for a patch error
  # and simply let it start twice.
  quickchat-redis.json: |
    {
      "file": "/data/plugins/Quickchat/redis.yml",
      "ops": [
        {
          "$set": {
            "path": "$.redis.enabled",
            "value": true
          }
        },
        {
          "$set": {
            "path": "$.redis.server-id",
            "value": "${CFG_QUICKCHAT_SERVER_ID}"
          }
        },
        {
          "$set": {
            "path": "$.redis.connection.host",
            "value": "minecraft-valkey.media.svc.cluster.local"
          }
        },
        {
          "$set": {
            "path": "$.redis.connection.port",
            "value": 6379
          }
        }
      ]
    }
