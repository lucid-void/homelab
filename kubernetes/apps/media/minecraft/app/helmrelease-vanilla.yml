---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vanilla
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      app:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # See matcha — 30s default is not enough to flush a world on shutdown.
          terminationGracePeriodSeconds: 120
          securityContext:
            fsGroup: 2200
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          filebrowser-init:
            image:
              repository: filebrowser/filebrowser
              tag: v2.63.23
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                DB=/database/filebrowser.db
                filebrowser config init --database "$DB" --root /srv --auth.method=json || true
                filebrowser config set --database "$DB" --root /srv --auth.method=json
                filebrowser users add admin "$FB_ADMIN_PASSWORD" \
                  --database "$DB" --perm.admin 2>/dev/null \
                  || filebrowser users update admin --database "$DB" \
                       --password "$FB_ADMIN_PASSWORD" --perm.admin
                echo "filebrowser admin account ready"
            envFrom:
              - secretRef:
                  name: minecraft-secret
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
        containers:
          app:
            image:
              repository: itzg/minecraft-server
              tag: 2026.7.2-java25
            env:
              EULA: "TRUE"
              TZ: Europe/Brussels
              UID: "2202"
              GID: "2200"
              # Paper, same as matcha. The name is now about content, not engine:
              # this is the plugin-free server, not a different server software.
              # Paper is faster and far gentler on chunk I/O than true vanilla,
              # at the cost of some redstone/mob behaviour differing subtly from
              # the client's expectations.
              TYPE: PAPER
              VERSION: "26.2"
              MEMORY: 6G
              # Aikar's GC tuning — worth having on any Paper server, and matcha
              # already runs it.
              USE_AIKAR_FLAGS: "true"
              MOTD: "vanilla"
              DIFFICULTY: normal
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "6"
              # See matcha: Velocity does the Mojang check and forwards a signed
              # identity; the velocity patch makes Paper reject unsigned logins,
              # so this server still cannot be joined directly.
              ONLINE_MODE: "FALSE"
              PATCH_DEFINITIONS: /patches
              # Unique per server — QuickChat keys its cross-server routing
              # on this, so two servers sharing an id break the bridge.
              CFG_QUICKCHAT_SERVER_ID: "vanilla"
              CFG_VELOCITY_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: velocity-secret
                    key: CFG_VELOCITY_SECRET
              ENABLE_ROLLING_LOGS: "true"
              ENABLE_RCON: "true"
              RCON_PORT: "25575"
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-secret
                    key: RCON_PASSWORD

              # This server is no longer strictly plugin-free — the name now marks
              # it as the one without matcha's content pack, not the one without
              # plugins. All list paper + 26.2.
              #
              #   chunky    — offline terrain pregeneration; run it AFTER Terralith
              #               is loaded, or you bake vanilla terrain into the world
              #   squaremap — live web map on 8080 (see the `map` Service)
              #   veinminer — mine a whole ore vein in one break
              # quickchat bridges chat to matcha via minecraft-valkey — Velocity
              # does not merge chat itself. Must be on BOTH servers.
              # luckperms + placeholderapi are hard dependencies of quickchat,
              # declared in its plugin.yml rather than Modrinth metadata, so
              # MODRINTH_DOWNLOAD_DEPENDENCIES will not fetch them. Omit either
              # and Quickchat fails to load (UnknownDependencyException) and the
              # chat bridge silently stays one-way.
              #   jeirecipefix — re-sends the server's recipe set to JEI/REI/EMI.
              #               Since MC 1.21.2 the server sends clients recipe-book
              #               *displays* only, and only for already-unlocked
              #               recipes, so a recipe viewer shows nothing on a
              #               plugin server. Vanilla protocol change, not a Paper
              #               bug; JEI's own answer ("install JEI on the server")
              #               is impossible because JEI is a mod. Needed here too
              #               even though this server adds no recipes of its own —
              #               plain vanilla recipes stopped syncing as well.
              #               Not `jei-recipe-bridge`: it stops at 26.1.2.
              MODRINTH_PROJECTS: "luckperms,placeholderapi,chunky,squaremap,veinminer,quickchatv2,jeirecipefix"
              MODRINTH_DOWNLOAD_DEPENDENCIES: required

              # Terralith — overworld generation overhaul. Modrinth lists it with
              # loaders=[datapack, fabric, forge, neoforge, quilt] and NO paper
              # build, so it must be installed as a datapack (as here) rather than
              # via MODRINTH_PROJECTS, which would fail to resolve and abort
              # startup — the same trap that `spark` hit on matcha.
              #
              # WARNING: this only shapes terrain generated *after* it loads.
              # `world` already has chunks, so existing terrain stays vanilla and
              # meets Terralith biomes at a hard seam. For a clean result the world
              # needs regenerating; see design/RUNBOOK or just delete /data/world.
              DATAPACKS: "https://cdn.modrinth.com/data/8oi3bsk5/versions/CzijfXJQ/Terralith_26.2_v2.6.4.zip"
              REMOVE_OLD_DATAPACKS: "true"

              LEVEL: world

              # Explicitly empty, not merely absent. This server had
              # resource-pack-sha1 set to the pack's *URL* instead of its hash,
              # which failed the `server_resource_pack` configuration task and
              # disconnected every joining client. Clearing server.properties by
              # hand did not fix it — that file is read once at boot, so the old
              # value stayed live for 10h until the pod cycled. Declaring the empty
              # value here means itzg rewrites it on every start and the failure
              # cannot come back through a manual edit.
              #
              # vanilla is the plugin-free server and has no datapack in its world,
              # so pushing matcha's pack here would give clients assets for content
              # this server does not have.
              RESOURCE_PACK: ""
              RESOURCE_PACK_SHA1: ""
              RESOURCE_PACK_ENFORCE: "false"

              OPS: "KillerBurger"

              # Gamerules live in level.dat, not server.properties, so there is
              # no itzg env for them — but they ARE world state, which means an
              # in-game `/gamerule` would persist yet leave no trace in git.
              # Re-applying them over RCON on every boot keeps git authoritative
              # and means they survive losing the PVC, the same reasoning as
              # driving LEVEL/OPS/DATAPACKS from env rather than the PVC.
              # **MC 26.x renamed every gamerule to snake_case** — it is
              # `keep_inventory`, NOT the `keepInventory` that every guide and
              # wiki page still shows. A wrong name fails with "Incorrect
              # argument for command" and, because RCON_CMDS_STARTUP does not
              # gate startup on command success, the server comes up perfectly
              # healthy with the rule simply never applied. Verify a rule name
              # against a running server before adding it here:
              #   kubectl exec … -- rcon-cli gamerule <name>
              # (note it is not a blind camelCase→snake_case mapping either:
              #  doFireTick is not `do_fire_tick`.)
              #   keep_inventory — keep items on death
              #   mob_griefing   — stop creepers/endermen editing the world
              #                    (also stops villager farming and mob-spread
              #                    fire, which is the usual trade-off)
              RCON_CMDS_STARTUP: |-
                gamerule keep_inventory true
                gamerule mob_griefing false

              # See matcha — must stay below terminationGracePeriodSeconds.
              STOP_DURATION: "90"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 90
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                memory: 6Gi
                cpu: 500m
              # Tracks MEMORY (6G heap) + ~3Gi for metaspace, GC structures and
              # direct buffers. Raising MEMORY without raising this is an
              # OOMKill, not a slow server: the JVM sizes its heap from MEMORY
              # and the cgroup kills it on the way up.
              #
              # 9Gi, not 8Gi: itzg sets -Xms AND -Xmx from MEMORY, so the heap
              # commits to the full 6 GiB and stays there. Measured non-heap
              # overhead is ~1.2 GiB, putting steady-state RSS at ~7.2 GiB —
              # exactly 90% of an 8Gi limit, so MinecraftMemoryNearLimit fired
              # continuously (2026-08-03/04) with only ~0.8 GiB of real
              # headroom left. 9Gi puts steady state near 80%.
              limits:
                memory: 9Gi

          backup:
            image:
              repository: itzg/mc-backup
              tag: "2026.7.3"
            env:
              TZ: Europe/Brussels
              BACKUP_INTERVAL: "2h"
              INITIAL_DELAY: "5m"
              PAUSE_IF_NO_PLAYERS: "true"
              PRUNE_BACKUPS_DAYS: "7"
              BACKUP_METHOD: tar
              SRC_DIR: /data
              DEST_DIR: /backups
              RCON_HOST: localhost
              RCON_PORT: "25575"
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-secret
                    key: RCON_PASSWORD
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
            resources:
              requests:
                memory: 64Mi
                cpu: 25m
              limits:
                memory: 512Mi

          files:
            image:
              repository: filebrowser/filebrowser
              tag: v2.63.23
            args:
              - --database=/database/filebrowser.db
              - --root=/srv
              - --address=0.0.0.0
              - --port=8081
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
            probes:
              # Liveness only — see matcha.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: false
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 256Mi

    service:
      app:
        controller: app
        # See matcha — Velocity finds this via [servers]/[forced-hosts] in
        # velocity-config.yml, not via a Service annotation.
        ports:
          minecraft:
            port: 25565
      files:
        controller: app
        # See matcha — keeps the file manager reachable while the game server is
        # down, which is when you most need it.
        publishNotReadyAddresses: true
        ports:
          http:
            # 8081 — squaremap owns 8080 in this pod's network namespace.
            port: 8081
      map:
        controller: app
        ports:
          http:
            port: 8080

    persistence:
      data:
        existingClaim: vanilla-data
        advancedMounts:
          app:
            app:
              - path: /data
            backup:
              - path: /data
                readOnly: true
            files:
              - path: /srv
            filebrowser-init:
              - path: /srv
      fbdb:
        existingClaim: vanilla-data
        advancedMounts:
          app:
            files:
              - path: /database
                subPath: .filebrowser
            filebrowser-init:
              - path: /database
                subPath: .filebrowser
      fbconfig:
        type: emptyDir
        advancedMounts:
          app:
            files:
              - path: /config
      patches:
        type: configMap
        name: minecraft-patches
        advancedMounts:
          app:
            app:
              - path: /patches
                readOnly: true
      backups:
        existingClaim: mc-backups
        advancedMounts:
          app:
            backup:
              - path: /backups
                subPath: vanilla
