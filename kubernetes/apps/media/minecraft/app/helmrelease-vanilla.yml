---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vanilla
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      app:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2200
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          filebrowser-init:
            image:
              repository: filebrowser/filebrowser
              tag: v2.63.23
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                DB=/database/filebrowser.db
                filebrowser config init --database "$DB" --root /srv --auth.method=json || true
                filebrowser config set --database "$DB" --root /srv --auth.method=json
                filebrowser users add admin "$FB_ADMIN_PASSWORD" \
                  --database "$DB" --perm.admin 2>/dev/null \
                  || filebrowser users update admin --database "$DB" \
                       --password "$FB_ADMIN_PASSWORD" --perm.admin
                echo "filebrowser admin account ready"
            envFrom:
              - secretRef:
                  name: minecraft-secret
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
        containers:
          app:
            image:
              repository: itzg/minecraft-server
              tag: 2026.7.2-java25
            env:
              EULA: "TRUE"
              TZ: Europe/Brussels
              UID: "2202"
              GID: "2200"
              # Paper, same as matcha. The name is now about content, not engine:
              # this is the plugin-free server, not a different server software.
              # Paper is faster and far gentler on chunk I/O than true vanilla,
              # at the cost of some redstone/mob behaviour differing subtly from
              # the client's expectations.
              TYPE: PAPER
              VERSION: "26.2"
              MEMORY: 6G
              # Aikar's GC tuning — worth having on any Paper server, and matcha
              # already runs it.
              USE_AIKAR_FLAGS: "true"
              MOTD: "vanilla"
              DIFFICULTY: normal
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "6"
              ENABLE_ROLLING_LOGS: "true"
              ENABLE_RCON: "true"
              RCON_PORT: "25575"
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-secret
                    key: RCON_PASSWORD
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 90
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                memory: 6Gi
                cpu: 500m
              # Tracks MEMORY (6G heap) + ~2Gi for metaspace, GC structures and
              # direct buffers — same ratio as matcha's 4G/6Gi. Raising MEMORY
              # without raising this is an OOMKill, not a slow server: the JVM
              # sizes its heap from MEMORY and the cgroup kills it on the way up.
              limits:
                memory: 8Gi

          backup:
            image:
              repository: itzg/mc-backup
              tag: "2026.7.3"
            env:
              TZ: Europe/Brussels
              BACKUP_INTERVAL: "2h"
              INITIAL_DELAY: "5m"
              PAUSE_IF_NO_PLAYERS: "true"
              PRUNE_BACKUPS_DAYS: "7"
              BACKUP_METHOD: tar
              SRC_DIR: /data
              DEST_DIR: /backups
              RCON_HOST: localhost
              RCON_PORT: "25575"
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-secret
                    key: RCON_PASSWORD
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
            resources:
              requests:
                memory: 64Mi
                cpu: 25m
              limits:
                memory: 512Mi

          files:
            image:
              repository: filebrowser/filebrowser
              tag: v2.63.23
            args:
              - --database=/database/filebrowser.db
              - --root=/srv
              - --address=0.0.0.0
              - --port=8080
            securityContext:
              runAsUser: 2202
              runAsGroup: 2200
            probes:
              # Liveness only — see matcha.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: false
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 256Mi

    service:
      app:
        controller: app
        annotations:
          mc-router.itzg.me/externalServerName: vanilla.blackcats.cc
        ports:
          minecraft:
            port: 25565
      files:
        controller: app
        # See matcha — keeps the file manager reachable while the game server is
        # down, which is when you most need it.
        publishNotReadyAddresses: true
        ports:
          http:
            port: 8080

    persistence:
      data:
        existingClaim: vanilla-data
        advancedMounts:
          app:
            app:
              - path: /data
            backup:
              - path: /data
                readOnly: true
            files:
              - path: /srv
            filebrowser-init:
              - path: /srv
      fbdb:
        existingClaim: vanilla-data
        advancedMounts:
          app:
            files:
              - path: /database
                subPath: .filebrowser
            filebrowser-init:
              - path: /database
                subPath: .filebrowser
      fbconfig:
        type: emptyDir
        advancedMounts:
          app:
            files:
              - path: /config
      backups:
        existingClaim: mc-backups
        advancedMounts:
          app:
            backup:
              - path: /backups
                subPath: vanilla
