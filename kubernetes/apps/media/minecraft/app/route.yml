---
# The Minecraft ports themselves are not routed here — they're raw TCP through
# the Velocity proxy on 172.16.20.52:25565. These routes only expose the filebrowser
# sidecars, which are ordinary HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matcha-files
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - matcha-files.blackcats.cc
  rules:
    - backendRefs:
        - name: matcha-files
          port: 8081
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vanilla-files
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - vanilla-files.blackcats.cc
  rules:
    - backendRefs:
        - name: vanilla-files
          port: 8081
---
# squaremap's live web maps. Read-only and unauthenticated (squaremap has no auth
# of its own) — consistent with the rest of the VPN-gated media stack.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matcha-map
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - matcha-map.blackcats.cc
  rules:
    - backendRefs:
        - name: matcha-map
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vanilla-map
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - vanilla-map.blackcats.cc
  rules:
    - backendRefs:
        - name: vanilla-map
          port: 8080
