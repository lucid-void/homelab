---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mc-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc-router
    spec:
      serviceAccountName: mc-router
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: mc-router
          image: itzg/mc-router:1.45.2
          args:
            # Watch Services for mc-router.itzg.me/externalServerName instead of
            # carrying a static --mapping list. Adding a server is then just a new
            # HelmRelease with that annotation — no change to this Deployment.
            - --in-kube-cluster
            - --api-binding
            - :8080
          ports:
            - name: minecraft
              containerPort: 25565
            - name: api
              containerPort: 8080
          # The Minecraft handshake is a raw TCP protocol; a TCP probe is the only
          # meaningful liveness signal on the proxy port.
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
