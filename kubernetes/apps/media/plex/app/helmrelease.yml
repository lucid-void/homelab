---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      app:
        replicas: 1
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/plex
              tag: "1.43.3"
            env:
              TZ: Europe/Brussels
              PUID: "2202"
              PGID: "2200"
              VERSION: docker
              ADVERTISE_IP: "https://plex.blackcats.cc:443,http://172.16.20.51:32400"
              # PLEX_CLAIM: ""  # set once on first deploy if claiming a new server
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                memory: 1Gi
                cpu: 100m
              limits:
                memory: 4Gi

    service:
      app:
        controller: app
        ports:
          http:
            port: 32400
      direct:
        controller: app
        type: LoadBalancer
        labels:
          lbpool: pool-b
        annotations:
          # Pinned, because ADVERTISE_IP above hardcodes 172.16.20.51 — letting
          # LB-IPAM pick freely could hand this Service .52 on a reconcile and
          # silently break direct/GDM clients.
          # This used to carry lbipam.cilium.io/sharing-key to share .51 with
          # mc-router; that made two nodes announce one IP (one Lease per
          # Service, leaders elected independently) and reset any long-lived
          # connection whose ARP entry flipped. minecraft-proxy now owns .52.
          lbipam.cilium.io/ips: "172.16.20.51"
        ports:
          plex:
            port: 32400

    persistence:
      config:
        existingClaim: plex-config-local
        globalMounts:
          - path: /config
      media:
        existingClaim: media-nfs
        globalMounts:
          - path: /Media
            readOnly: true
