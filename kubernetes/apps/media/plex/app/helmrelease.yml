---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      app:
        replicas: 1
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/plex
              tag: "1.43.3"
            env:
              TZ: Europe/Brussels
              PUID: "2202"
              PGID: "2200"
              VERSION: docker
              ADVERTISE_IP: "https://plex.blackcats.cc:443,http://172.16.20.51:32400"
              # PLEX_CLAIM: ""  # set once on first deploy if claiming a new server
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                memory: 1Gi
                cpu: 100m
              limits:
                memory: 4Gi

    service:
      app:
        controller: app
        ports:
          http:
            port: 32400
      direct:
        controller: app
        type: LoadBalancer
        labels:
          lbpool: pool-b
        annotations:
          # pool-b is a single address (172.16.20.51). This sharing-key lets
          # mc-router bind 25565 on the same IP — Cilium co-locates Services that
          # share a key as long as their ports don't collide (Plex is 32400).
          # media/mc-router carries the identical annotation; drop it from either
          # side and the other Service loses its IP.
          lbipam.cilium.io/sharing-key: "pool-b-shared"
        ports:
          plex:
            port: 32400

    persistence:
      config:
        existingClaim: plex-config-local
        globalMounts:
          - path: /config
      media:
        existingClaim: media-nfs
        globalMounts:
          - path: /Media
            readOnly: true
