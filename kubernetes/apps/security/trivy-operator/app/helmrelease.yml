---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: "0.36.0"
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      registry: mirror.gcr.io
      repository: aquasec/trivy-operator
      # Pinned digest — supply chain hardening; bump alongside chart upgrades
      tag: "0.34.0@sha256:0e4f11e9632f34097f259f3a59d34bab4eea8cee9aef510d15cdfc7481d5e49c"

    operator:
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      infraAssessmentScannerEnabled: false
      scanJobTimeout: 5m
      scanJobsConcurrentLimit: 2
      # Scan user workloads only; exclude kube-system and flux-system noise
      targetNamespaces: "auth,cert-manager,cnpg-system,democratic-csi,freshrss,gitea,homebox,homepage,immich,media,monitoring,network,paperless,postgres,security"

    trivy:
      # Standalone mode: pull the vuln DB once at operator startup, reuse for all scans.
      # dbRepository is left at the chart default (aquasec/trivy-db from mirror.gcr.io).
      # Setting a full ghcr.io/... path here causes double-prefixing: mirror.gcr.io/ghcr.io/...
      mode: standalone
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
        limits:
          cpu: 500m
          memory: 500Mi
          ephemeral-storage: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        # 2Gi, not 1Gi. The operator holds the whole report set in memory while
        # reconciling, and on 2026-08-28 it peaked at 1022 MiB against a 1 GiB
        # limit -- pinned to the ceiling, OOMKilled (exit 137) 58 times in 2d9h,
        # which fired KubePodCrashLooping / KubePodNotReady /
        # KubeDeploymentReplicasMismatch. Steady state is ~450 MiB, so the
        # headroom only matters during a full scan sweep. Re-check with:
        #   max_over_time(container_memory_working_set_bytes{
        #     namespace="security",container="trivy-operator",
        #     metrics_path="/metrics/cadvisor"}[7d])
        memory: 2Gi
