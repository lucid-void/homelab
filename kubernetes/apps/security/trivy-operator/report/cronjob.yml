---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-report
  namespace: security
  annotations:
    # `apk add` writes to /etc/apk, /lib/apk and /var/cache
    ignore-check.kube-linter.io/no-read-only-root-fs: "alpine bootstrap installs packages at startup"
    # `apk add` at startup needs root; runAsNonRoot:true makes it fail silently
    # with empty logs
    ignore-check.kube-linter.io/run-as-non-root: "alpine bootstrap installs packages at startup"
spec:
  schedule: "0 8 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      # Self-clean after 24h. failedJobsHistoryLimit alone retains a failed
      # Job until three MORE failures evict it, so one rare failure leaves the
      # object sitting there and KubeJobFailed re-fires ~twice a day forever
      # (minecraft-backup did exactly this for 7 days, 2026-08-20 to 08-28).
      # Nothing is lost: the script's own Gotify ✗ notification carries the
      # log tail and persists in Gotify independently of this object.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: security-reporter
          restartPolicy: Never
          securityContext:
            runAsNonRoot: false
          volumes:
            - name: script
              configMap:
                name: security-report-script
                defaultMode: 0755
          containers:
            - name: reporter
              image: alpine:3.24
              command: ["/bin/sh", "-c"]
              args:
                # `timeout` bounds the install and the `&&` makes a failure exit
                # non-zero instead of hanging silently; see gotify-bootstrap.
                - timeout 300 apk add --no-cache bash curl jq kubectl && exec /bin/bash /scripts/report.sh
              envFrom:
                - secretRef:
                    name: gotify-secret
                    optional: true
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
