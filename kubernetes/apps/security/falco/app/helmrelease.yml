---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
spec:
  interval: 30m
  chart:
    spec:
      chart: falco
      version: "9.1.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    driver:
      kind: modern_ebpf

    collectors:
      enabled: true

    # llm-1 carries workload=llm:NoSchedule (see design/llm-deployment.md §3).
    # Without this entry Falco silently drops to 3 of 4 nodes -- the DaemonSet
    # reports DESIRED 3 and looks perfectly healthy, so the gap is invisible
    # unless you compare against the node count. llm-1 is also the node that
    # pulls multi-GB model weights off the internet, i.e. the one most worth
    # watching.
    #
    # Helm REPLACES lists rather than merging them, so the chart's two default
    # control-plane tolerations must be repeated here or they are lost.
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: llm

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # The falcoctl artifact-follow sidecar ships with no requests of its own,
    # unlike the falco and falcosidekick containers above. Sized from a 30d
    # VictoriaMetrics window: p90 32, peak 72 MiB.
    falcoctl:
      artifact:
        follow:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 192Mi

    falcosidekick:
      enabled: true
      config:
        gotify:
          hostport: "http://gotify.monitoring.svc.cluster.local"
          minimumpriority: "warning"
      extraEnv:
        - name: GOTIFY_TOKEN
          valueFrom:
            secretKeyRef:
              name: falco-gotify-secret
              key: GOTIFY_TOKEN
              optional: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
