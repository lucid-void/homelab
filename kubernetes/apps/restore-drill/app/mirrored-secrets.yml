---
# Filled in by Reflector from the backup jobs' own SealedSecrets. Declared here
# with no values at all (so there is nothing to seal) under distinct names,
# because all three restic sources are called restic-secret. ssa: Merge stops
# Flux stripping the data Reflector writes.
apiVersion: v1
kind: Secret
metadata:
  name: restic-gitea
  namespace: restore-drill
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "gitea/restic-secret"
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: restic-postgres
  namespace: restore-drill
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "postgres/restic-secret"
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: restic-immich
  namespace: restore-drill
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "immich/restic-secret"
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: rclone-secret
  namespace: restore-drill
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "gitea/rclone-secret"
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
