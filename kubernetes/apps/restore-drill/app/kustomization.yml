---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yml
  - ./networkpolicy.yml
  - ./pvc.yml
  - ./mirrored-secrets.yml
  - ./cronjob-restore.yml
  - ./cronjob-sso.yml
  - ./cronjob-immich.yml
# The scripts are real files (tested by ../tests/) mounted through a generated
# ConfigMap. The generated name carries a content hash, so a script edit rolls
# into the next Job without anything being edited in place.
configMapGenerator:
  - name: drill-scripts
    namespace: restore-drill
    files:
      - scripts/lib.sh
      - scripts/restore.sh
      - scripts/load-sso.sh
      - scripts/fsck-gitea.sh
      - scripts/drive-sso.sh
      - scripts/load-immich.sh
      - scripts/drive-immich.sh
