---
# NOT a reconciling resource. The operator imports this realm by running a Job;
# it creates the realm when absent but does not continuously correct drift on an
# existing one. Treat this file as the realm's initial shape, not its live state:
# once users and clients exist, a change here may need the realm deleted (or the
# setting changed by hand in the admin console) before it takes effect.
#
# Clients are NOT defined here. They are KeycloakOIDCClient CRs under
# kubernetes/apps/keycloak/clients/, which reconcile; this import does not.
# Groups, group membership and group->role mappings are created by hand in the
# admin console — no CRD expresses them and OpenTofu was rejected for clients.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: homelab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    SMTP_USERNAME:
      secret:
        name: keycloak-smtp
        key: username
    SMTP_PASSWORD:
      secret:
        name: keycloak-smtp
        key: password
  realm:
    realm: homelab
    displayName: Homelab
    enabled: true

    # Self-registration off: accounts are created by an admin.
    registrationAllowed: false
    resetPasswordAllowed: true
    rememberMe: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    verifyEmail: false

    # Requests from private network addresses are exempt; this only forces HTTPS
    # for genuinely external clients, which reach Keycloak through the Gateway.
    sslRequired: external

    passwordPolicy: "length(12)"

    # Mail goes through the Proton Mail Bridge, not Gotify: other
    # people use this realm and need self-service password reset to reach a
    # real inbox. host is 127.0.0.1 because the bridge certificate's only SAN
    # is IP:127.0.0.1 — the socat sidecar on the Keycloak pod relays to the
    # bridge Service. See design/decisions/protonmail-bridge.md.
    # `from` must be an address the Proton account actually owns — Proton rejects
    # anything else at DATA with `554 ... sender or recipient address is not valid`,
    # even though the envelope MAIL FROM is accepted. keycloak@blackcats.cc only
    # worked under the old mailrise relay, which validated nothing. Adding
    # blackcats.cc as a Proton custom domain would allow a service address here.
    smtpServer:
      host: 127.0.0.1
      port: "1025"
      from: maxim.claeys@pm.me
      fromDisplayName: Keycloak
      ssl: "false"
      starttls: "true"
      auth: "true"
      user: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
