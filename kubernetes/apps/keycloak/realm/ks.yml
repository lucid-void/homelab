---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app keycloak-realm
  namespace: flux-system
spec:
  targetNamespace: keycloak
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: keycloak
  path: ./kubernetes/apps/keycloak/realm/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # wait: false — the operator runs the import as a Job against a Keycloak that
  # must already be serving; health-gating this Kustomization would deadlock the
  # first reconcile behind a pod that is still migrating an empty schema.
  wait: false
  interval: 30m
  timeout: 10m
