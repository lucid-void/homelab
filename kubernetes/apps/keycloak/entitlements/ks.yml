---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app keycloak-entitlements
  namespace: flux-system
spec:
  targetNamespace: keycloak
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: keycloak-clients
  path: ./kubernetes/apps/keycloak/entitlements/app
  prune: true
  # Job spec is immutable, and editing the script or config changes it through the
  # generated ConfigMap's hash. See design/decisions/flux.md.
  force: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  timeout: 10m
