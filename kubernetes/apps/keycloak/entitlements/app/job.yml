---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-entitlements
  namespace: keycloak
spec:
  # Re-runs roughly hourly: the TTL deletes the finished Job and the Flux
  # Kustomization (interval 30m) recreates it, which is what repairs drift.
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: reconcile
          image: python:3.15.2-alpine3.24
          command:
            - python3
            - -I
            - -B
            - /config/reconcile.py
            - /config/entitlements.json
          env:
            # The admin API is driven over the public hostname on purpose: this is
            # the path every other SSO client depends on, so a failure here is real.
            - name: KEYCLOAK_URL
              value: https://sso.blackcats.cc
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: client-secret
            - name: GOTIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gotify-secret
                  key: GOTIFY_TOKEN
                  optional: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 96Mi
      volumes:
        # Generated by configMapGenerator, so the name carries a content hash. Editing
        # either file changes this pod spec, and force: true on the Flux Kustomization
        # recreates the Job, so an edit applies at once.
        - name: config
          configMap:
            name: keycloak-entitlements-config
