---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./job.yml
# entitlements.conf is JSON. kubeconform parses every .json under kubernetes/ as a
# manifest and fails on the missing `kind`, so it cannot use that extension.
configMapGenerator:
  - name: keycloak-entitlements-config
    namespace: keycloak
    files:
      - reconcile.py
      - entitlements.conf
