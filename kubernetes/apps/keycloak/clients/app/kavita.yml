---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: kavita
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: homelab
  client:
    # No `clientId` field exists on this CRD — see Task 5. The client id is
    # taken from metadata.name, verified against the live cluster in Task 5
    # step 6 before this fan-out was written.
    displayName: Kavita
    enabled: true
    loginFlows: [STANDARD]
    redirectUris:
      - https://kavita.blackcats.cc/signin-oidc
    webOrigins:
      - https://kavita.blackcats.cc
    # `user` is the entitlement gate: the per-client browser-flow override denies
    # login to anyone without it (Condition - user role, negated, + Deny access).
    # Every group for this client must therefore grant `user`, including the admin
    # group — the CRD takes bare strings, so composite roles are not expressible.
    # `Login` and `library-<name>` are Kavita's own vocabulary: with SyncUserSettings on,
    # it applies them from the kavita_roles claim, so a new library needs a new role here
    # and in entitlements.conf. It matches `admin` to its Admin role case-insensitively.
    roles: [user, admin, Login, library-Manga]
    auth:
      method: client-secret
      secretRef:
        name: kavita-client-secret
        key: secret
