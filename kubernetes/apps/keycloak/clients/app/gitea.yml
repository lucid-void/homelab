---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: gitea
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: homelab
  client:
    # There is no `clientId` field on this CRD. It is not defined anywhere in
    # the v2alpha1 schema, and the CRD sets no x-kubernetes-preserve-unknown-fields,
    # so the apiserver silently prunes any clientId written here — the manifest
    # would look like it named the client while doing nothing. The client id
    # comes from metadata.name, which is why this CR is named after the app.
    displayName: Gitea
    enabled: true
    loginFlows: [STANDARD]
    # The provider-name segment is case-sensitive and moves Zitadel -> Keycloak
    # at cutover, which changes the callback path. It must match the
    # oauth[].name that Task 7 writes into gitea-oidc-secret exactly.
    redirectUris:
      - https://gitea.blackcats.cc/user/oauth2/Keycloak/callback
    webOrigins:
      - https://gitea.blackcats.cc
    roles:
      - admin
      - user
    auth:
      method: client-secret
      secretRef:
        name: gitea-client-secret
        key: secret
