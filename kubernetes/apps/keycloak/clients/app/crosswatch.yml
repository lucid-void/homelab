---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  # There is no `clientId` field on this CRD — the apiserver prunes one in silence.
  # metadata.name IS the client id.
  name: crosswatch
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: homelab
  client:
    displayName: CrossWatch
    enabled: true
    loginFlows: [STANDARD]
    redirectUris:
      # Read from the running image: api/authOidcAPI.py builds this as
      # `{origin}/api/app-auth/oidc/callback` (_callback_url, and the router is
      # mounted under /api/app-auth). The app never reports the path in its UI,
      # so take it from the source, not from a guess.
      - https://crosswatch.blackcats.cc/api/app-auth/oidc/callback
    webOrigins:
      - https://crosswatch.blackcats.cc
    # `user` is the entitlement gate, matching every other client in this realm.
    roles: [user]
    auth:
      method: client-secret
      secretRef:
        name: crosswatch-client-secret
        key: secret
