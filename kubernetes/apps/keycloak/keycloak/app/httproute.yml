---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - sso.blackcats.cc
  rules:
    - backendRefs:
        # The operator names the Service after the Keycloak CR, suffixed -service.
        - name: keycloak-service
          port: 8080
