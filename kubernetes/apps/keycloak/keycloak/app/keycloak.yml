---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1

  # KeycloakOIDCClient CRs cannot reconcile without this: the operator calls a
  # client admin API the server does not expose by default, and fails with
  # "Cannot create/update because the server does not have client-admin-api:v2
  # enabled". Keycloak classifies CLIENT_ADMIN_API_V2 as EXPERIMENTAL — its
  # lowest support tier, below PREVIEW — so it may change or disappear in a
  # future release with no deprecation cycle, and in this repo a Renovate bump
  # of keycloak-k8s-resources IS a Keycloak upgrade. Accepted deliberately:
  # clients already written live in the realm database as ordinary rows, so
  # losing the feature would break reconciliation of new changes, not logins.
  features:
    enabled:
      - client-admin-api:v2

  db:
    vendor: postgres
    host: postgres-rw.postgres.svc.cluster.local
    port: 5432
    database: keycloak
    # Reflector mirrors postgres/keycloak-role-secret into this namespace.
    usernameSecret:
      name: keycloak-role-secret
      key: username
    passwordSecret:
      name: keycloak-role-secret
      key: password

  # Full URL, not a bare hostname: TLS terminates at the shared Gateway, so
  # Keycloak must be told the external scheme or it advertises http:// in the
  # OIDC discovery document and every redirect_uri breaks.
  hostname:
    hostname: https://sso.blackcats.cc

  # Keycloak itself speaks plain HTTP; the Gateway owns the certificate.
  http:
    httpEnabled: true

  proxy:
    headers: xforwarded

  # Ingress objects are never used in this cluster — see httproute.yml.
  ingress:
    enabled: false

  # The operator defaults to requests 1700Mi / limits 2Gi per instance, which is
  # far more than a homelab realm needs and would eat request headroom on a
  # control plane that is already overcommitted on limits. Revisit from a 30d
  # VictoriaMetrics window once it has run, per the platform sizing convention:
  #   quantile_over_time(0.90, container_memory_working_set_bytes{
  #     namespace="keycloak", metrics_path="/metrics/cadvisor", container!=""}[30d])
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1536Mi

  additionalOptions:
    # Postgres traffic is cleartext on the internal VLAN by convention (the same
    # choice Zitadel makes with SSL.Mode=disable). Without this the JDBC driver
    # defaults to sslmode=prefer and negotiates TLS it does not verify.
    - name: db-url-properties
      value: "?sslmode=disable"

  # The Proton Mail Bridge certificate is CN=127.0.0.1 with a single
  # IP:127.0.0.1 SAN. Keycloak must both trust it and reach the bridge at an
  # address the certificate matches — hence the truststore here and the socat
  # sidecar below. Mirrored from paperless/protonmail-bridge-cert by Reflector.
  truststores:
    protonmail-bridge:
      secret:
        name: protonmail-bridge-cert

  unsupported:
    podTemplate:
      spec:
        # A NATIVE sidecar (initContainer + restartPolicy: Always), not an
        # ordinary container. The operator applies this podTemplate to the
        # realm-import Job as well as to the StatefulSet, and an ordinary
        # socat container never exits — it left the import Job wedged at 1/2
        # with the server container already Completed. The kubelet terminates
        # native sidecars once a Job's main containers finish, and in the
        # StatefulSet this additionally guarantees the relay is up before
        # Keycloak starts.
        initContainers:
          # Relays 127.0.0.1:1025 to the bridge as plain TCP — it terminates no
          # TLS, so STARTTLS still negotiates end to end against the
          # certificate Keycloak trusts via spec.truststores.
          - name: smtp-relay
            image: alpine/socat:1.8.1.3
            restartPolicy: Always
            args:
              - TCP-LISTEN:1025,fork,reuseaddr,bind=127.0.0.1
              - TCP:protonmail-bridge.paperless.svc.cluster.local:25
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 65534
              capabilities:
                drop: ["ALL"]
