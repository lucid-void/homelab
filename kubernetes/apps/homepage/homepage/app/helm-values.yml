---
config:
  kubernetes:
    mode: cluster

  settings:
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    useEqualHeights: true
    layout:
      Media:
        columns: 3
        style: row
      Games:
        columns: 4
        style: row
      Documents:
        columns: 3
        style: row
      Infrastructure:
        columns: 3
        style: row

  widgets:
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium
          hourCycle: h23

  services:
    - Media:
        - Plex:
            href: https://plex.blackcats.cc
            description: Media server
            icon: plex.png
        - Seerr:
            href: https://seerr.blackcats.cc
            description: Request media
            icon: overseerr.png
        - Sonarr:
            href: https://sonarr.blackcats.cc
            description: TV series
            icon: sonarr.png
        - Radarr:
            href: https://radarr.blackcats.cc
            description: Movies
            icon: radarr.png
        - Prowlarr:
            href: https://prowlarr.blackcats.cc
            description: Indexers
            icon: prowlarr.png
        - Sabnzbd:
            href: https://nzb.blackcats.cc
            description: Downloader
            icon: sabnzbd.png
        - Suwayomi:
            href: https://suwayomi.blackcats.cc
            description: Manga downloader
            icon: suwayomi.png
        - Kavita:
            href: https://kavita.blackcats.cc
            description: Manga reader
            icon: kavita.png
        - Immich:
            href: https://immich.blackcats.cc
            description: Photos
            icon: immich.png
    - Games:
        # The Minecraft servers themselves are raw TCP on 172.16.20.52:25565 via
        # the Velocity proxy, so they have no web UI — connect in-game to
        # matcha.blackcats.cc / vanilla.blackcats.cc. These are the companions.
        - Matcha map:
            href: https://matcha-map.blackcats.cc
            description: Live world map — matcha
            icon: minecraft.png
        - Matcha files:
            href: https://matcha-files.blackcats.cc
            description: Datapacks, configs, world imports
            icon: filebrowser.png
        - Vanilla map:
            href: https://vanilla-map.blackcats.cc
            description: Live world map — vanilla (Terralith)
            icon: minecraft.png
        - Vanilla files:
            href: https://vanilla-files.blackcats.cc
            description: Datapacks, configs, world imports
            icon: filebrowser.png
        - RomM:
            href: https://romm.blackcats.cc
            description: ROM library
            icon: romm.png
    - Documents:
        - Paperless:
            href: https://paperless.blackcats.cc
            description: Document management
            icon: paperless-ngx.png
        - FreshRSS:
            href: https://rss.blackcats.cc
            description: RSS reader
            icon: freshrss.png
        - Homebox:
            href: https://homebox.blackcats.cc
            description: Home inventory
            icon: homebox.png
        - Joplin:
            href: https://joplin.blackcats.cc
            description: Notes sync
            icon: joplin.png
        - Degoog:
            href: https://degoog.blackcats.cc
            description: Search engine aggregator
            icon: mdi-magnify
    - Development:
        - Gitea:
            href: https://gitea.blackcats.cc
            description: Git service
            icon: gitea.png
    - Infrastructure:
        - Proxmox:
            href: https://pve.blackcats.cc:8006
            description: Hypervisor
            icon: proxmox.png
        - Zitadel:
            href: https://zitadel.blackcats.cc
            description: Identity & access
            icon: sh-zitadel
        - Gotify:
            href: https://gotify.blackcats.cc
            description: Notifications
            icon: gotify.png
        - Grafana:
            href: https://grafana.blackcats.cc
            description: Metrics dashboards
            icon: grafana.png
        - Gatus:
            href: https://gatus.blackcats.cc
            description: Status monitoring
            icon: gatus.png
        - Goldilocks:
            href: https://goldilocks.blackcats.cc
            description: VPA recommendations
            icon: goldilocks.png

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 256Mi

ingress:
  main:
    enabled: false

enableRbac: true
serviceAccount:
  create: true

env:
  HOMEPAGE_ALLOWED_HOSTS: home.blackcats.cc
