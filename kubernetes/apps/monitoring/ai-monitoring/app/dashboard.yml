---
# LLM inference dashboard. Auto-loaded by the Grafana sidecar (label
# grafana_dashboard: "1"), same as the minecraft and proxmox boards.
#
# Deliberately NOT the upstream llama-swap dashboard from docs/grafana: two
# thirds of its panels are GPU series (temperature, fan speed, VRAM, power draw)
# that are permanently empty on a CPU-only node, and empty panels teach people to
# stop reading the board.
#
# Every expression here was checked against live VictoriaMetrics before being
# written. Panel order follows triage: is it up -> does it have room -> what is
# it doing -> is it flapping.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-llm
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  ai-llm.json: "{\n  \"uid\": \"ai-llm\",\n  \"title\": \"LLM inference\",\n  \"tags\": [\n    \"ai\",\n    \"llm\",\n    \"llama-swap\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"1m\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"datasource\",\n        \"label\": \"Data source\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n        \"current\": {\n          \"text\": \"VictoriaMetrics\",\n          \"value\": \"VictoriaMetrics\"\n        },\n        \"hide\": 0,\n        \"refresh\": 1\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Inference backend\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 1\n              }\n            ]\n          },\n          \"mappings\": [\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"0\": {\n                  \"text\": \"DOWN\",\n                  \"color\": \"red\"\n                },\n                \"1\": {\n                  \"text\": \"UP\",\n                  \"color\": \"green\"\n                }\n              }\n            }\n          ]\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"up{job=~\\\".*llama-swap.*\\\"}\",\n          \"legendFormat\": \"llama-swap\",\n          \"instant\": true\n        }\n      ],\n      \"description\": \"Scrape health of llama-swap on llm-1. UP only means the proxy answers \\u2014 a model that failed to load still shows UP, because llama-swap serves /v1/models before any model is resident.\"\n    },\n    {\n      \"id\": 2,\n      \"title\": \"llm-1 memory available\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 8,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 4000000000.0\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 8000000000.0\n              }\n            ]\n          },\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"node_memory_MemAvailable_bytes{instance=\\\"172.16.20.14:9100\\\"}\",\n          \"legendFormat\": \"available\",\n          \"instant\": true\n        }\n      ],\n      \"description\": \"The honest capacity signal. llama-swap runs with NO memory limit (mmap page-cache accounting), so there is no cgroup ratio to watch and an overrun never OOMKills \\u2014 it just makes the model slow as the kernel reclaims and refaults the weights.\"\n    },\n    {\n      \"id\": 3,\n      \"title\": \"llm-1 /var free\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 20000000000.0\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 50000000000.0\n              }\n            ]\n          },\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"node_filesystem_avail_bytes{instance=\\\"172.16.20.14:9100\\\",mountpoint=\\\"/var\\\"}\",\n          \"legendFormat\": \"free\",\n          \"instant\": true\n        }\n      ],\n      \"description\": \"Model weights live on an openebs-hostpath PVC, which is a plain directory on this partition with NO quota. The 150Gi claim is advisory; this number is the real limit, shared with containerd, etcd and logs.\"\n    },\n    {\n      \"id\": 4,\n      \"title\": \"llm-1 memory available\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          },\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"node_memory_MemAvailable_bytes{instance=\\\"172.16.20.14:9100\\\"}\",\n          \"legendFormat\": \"available\"\n        }\n      ],\n      \"description\": \"A step down that never recovers is a model load. A slow decline under steady load means the KV cache is growing into territory that --ctx-size promised but the node cannot back.\"\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Container memory (working set)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          },\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"container_memory_working_set_bytes{namespace=\\\"ai\\\",container!=\\\"\\\",metrics_path=\\\"/metrics/cadvisor\\\"}\",\n          \"legendFormat\": \"{{pod}}/{{container}}\"\n        }\n      ],\n      \"description\": \"metrics_path is pinned because the kubelet exports container_* from BOTH /metrics/cadvisor and /metrics/resource \\u2014 an unpinned selector counts every container twice.\"\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Container CPU\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 13\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"ai\\\",container!=\\\"\\\",metrics_path=\\\"/metrics/cadvisor\\\"}[5m]))\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ],\n      \"description\": \"llama-swap is given --threads 6 to match llm-1's six P-cores. Sustained usage well above 6 cores means threads are landing on E-cores, which measurably hurts decode.\"\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Container restarts (1h)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 13\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"bars\",\n            \"fillOpacity\": 60\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 3\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"increase(kube_pod_container_status_restarts_total{namespace=\\\"ai\\\"}[1h])\",\n          \"legendFormat\": \"{{pod}}/{{container}}\"\n        }\n      ],\n      \"description\": \"Open WebUI restarting in a loop right after install usually means CreateContainerConfigError waiting on openwebui-oidc-secret from zitadel-bootstrap.\"\n    },\n    {\n      \"id\": 8,\n      \"title\": \"llama-swap host stats (load average)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 21\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"llamaswap_load_average\",\n          \"legendFormat\": \"{{instance}}\"\n        }\n      ],\n      \"description\": \"From llama-swap's own /metrics, which serves ONLY system metrics (llamaswap_cpu_util_percent, llamaswap_memory_*, load average, network). It does NOT expose llama.cpp's llamacpp:* token counters \\u2014 those live on the llama-server child process behind the /upstream passthrough, which must not be scraped because hitting it on an unloaded model triggers a 34 GiB load. If this panel is empty, `performance` is disabled in the llama-swap config.\"\n    }\n  ]\n}"
