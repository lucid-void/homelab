---
# Cross-namespace: the Services live in `ai` while these CRs live in
# `monitoring`, so namespaceSelector is REQUIRED — without it the selector is
# scoped to `monitoring` and silently matches nothing.
#
# Selectors key off monitoring.blackcats.cc/scrape rather than
# app.kubernetes.io/name, because Flux commonMetadata rewrites the latter on
# every resource in a Kustomization.
#
# WHAT /metrics ON LLAMA-SWAP ACTUALLY SERVES: only its own system metrics —
# llamaswap_cpu_util_percent, llamaswap_memory_*, llamaswap_load_average,
# llamaswap_network_bytes_total (plus GPU series that stay empty on a CPU node).
# It does NOT aggregate llama.cpp's `llamacpp:*` inference counters; those are
# exposed by the llama-server child process on a dynamic internal port and are
# only reachable through the /upstream/{model}/ passthrough. Do not scrape that
# path: on a model that is not loaded, the request would trigger a 34 GiB load.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: llama-swap
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - ai
  selector:
    matchLabels:
      monitoring.blackcats.cc/scrape: llama-swap
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
---
# THERE IS DELIBERATELY NO LiteLLM SCRAPE.
#
# Its /metrics endpoint returns 404 on the pinned version — Prometheus metrics
# are behind LiteLLM's enterprise tier. Verified against the running pod
# 2026-08-30:
#
#   $ curl -o /dev/null -w '%{http_code}' http://litellm.ai.svc:4000/metrics
#   404          ({"detail":"Not Found"}; /health/liveliness returns 200)
#
# A scrape was written first and removed after that check, rather than left
# pointing at a 404. A permanently-red `up` series is worse than no series: it
# trains everyone to ignore the one alert that matters, and LlamaSwapDown reads
# from the same `up` metric.
#
# Coverage is not lost. LiteLLM availability is alerted from
# kube_deployment_status_replicas_available (see vmrules.yml), and per-request
# accounting lives in its Postgres spend log. If a future version exposes
# /metrics without a licence, re-add a VMServiceScrape here and put the
# monitoring.blackcats.cc/scrape label back on the Service.
