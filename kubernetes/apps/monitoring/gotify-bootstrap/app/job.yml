---
apiVersion: batch/v1
kind: Job
metadata:
  name: gotify-bootstrap
  namespace: monitoring
spec:
  # Re-runs roughly hourly: the TTL deletes the finished Job and the Flux
  # Kustomization (interval 30m) recreates it. That periodic run is what makes
  # the drift check in bootstrap.sh worth anything — at the old 86400 a token
  # lost just after midnight stayed dead until the next day.
  ttlSecondsAfterFinished: 3600
  # bootstrap.sh blocks on `until curl .../health` with no bound of its own. If
  # Gotify never becomes reachable that loop would leave the pod Running and
  # Ready forever with no failure — the exact shape that wedged three bootstrap
  # Jobs for days in August 2026 and stalled everything downstream. A steady-state
  # run takes ~10s, so 600s only fires on a genuine hang.
  activeDeadlineSeconds: 600
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gotify-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: bootstrap
          # backup-tools bundles bash + curl + jq + kubectl, which is the whole
          # dependency set. This used to be a bare alpine image running
          # `apk add curl jq kubectl` at every start — a network fetch on every
          # run, and on 2026-08-15 a transient stall hung it for 39h.
          image: ghcr.io/lucid-void/backup-tools:v1.1.0
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          env:
            - name: GOTIFY_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: gotify-admin-secret
                  key: GOTIFY_DEFAULTUSER_PASS
            # kubectl writes a discovery cache under $HOME; the root filesystem
            # is read-only, so point it at the tmp emptyDir.
            - name: HOME
              value: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
      volumes:
        # Generated by configMapGenerator, so the name carries a content hash.
        # Editing bootstrap.sh therefore changes this pod spec, which is what
        # drives the re-run — see kustomization.yml.
        - name: script
          configMap:
            name: gotify-bootstrap-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
