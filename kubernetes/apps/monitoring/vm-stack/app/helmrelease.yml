---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.91.2"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ---------------------------------------------------------------------------
    # VictoriaMetrics Single — TSDB (replaces Prometheus)
    # ---------------------------------------------------------------------------
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "3"
        storage:
          storageClassName: openebs-hostpath
          resources:
            requests:
              storage: 30Gi
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 1500Mi

    # VMCluster not needed — single-node is sufficient for homelab
    vmcluster:
      enabled: false

    # ---------------------------------------------------------------------------
    # VMAgent — metrics scraping
    # ---------------------------------------------------------------------------
    vmagent:
      enabled: true
      spec:
        scrapeInterval: 60s
        extraArgs:
          promscrape.kubernetesSDCheckInterval: 5m
          promscrape.maxDroppedTargets: "10"
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            cpu: 250m
            memory: 512Mi

    # ---------------------------------------------------------------------------
    # VMAlert — alert rule evaluation
    # ---------------------------------------------------------------------------
    vmalert:
      enabled: true
      spec:
        resources:
          requests:
            memory: 64Mi
            cpu: 10m
          limits:
            memory: 256Mi

    # ---------------------------------------------------------------------------
    # AlertManager — routes vmalert → am-gotify-bridge → Gotify
    # ---------------------------------------------------------------------------
    alertmanager:
      enabled: true
      spec:
        # Sized from VictoriaMetrics, 30d window (request p90, limit ~2x peak).
        # Was 64Mi/128Mi: OOMKilled 2026-09-14 with a 7d peak of 125.1Mi against
        # the 128Mi limit — pinned at 97% of the ceiling. Alertmanager is the
        # single delivery path for every Gotify notification and runs one
        # replica, so each OOM is a window where alerts are silently lost.
        resources:
          requests:
            memory: 112Mi
            cpu: 10m
          limits:
            memory: 256Mi
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: gotify
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          group_by: ["alertname", "namespace"]
          routes:
            - matchers:
                - severity="none"
              receiver: blackhole
            - matchers:
                - severity="info"
              receiver: blackhole
            - matchers:
                - alertname="NodeNetworkTransmitErrs"
                - device=~"wt.+"
              receiver: blackhole
            - matchers:
                - alertname="KubeAPIErrorBudgetBurn"
              receiver: gotify
              repeat_interval: 24h
        receivers:
          - name: gotify
            # Re-enabled 2026-06-18: the control-plane flapping that caused the
            # original alert storm was resolved by the Proxmox XFS/LVM reinstall.
            # Alerts now flow again (needed so the Proxmox host/disk alerts
            # actually deliver). To silence, comment out webhook_configs.
            webhook_configs:
              - url: http://am-gotify-bridge.monitoring.svc.cluster.local:5000/webhook
                send_resolved: false
          - name: blackhole

    # ---------------------------------------------------------------------------
    # Grafana datasources
    # The chart default ships a second datasource of type
    # `victoriametrics-metrics-datasource`, which requires a Grafana plugin that
    # is NOT installed by default (chart leaves `grafana.plugins` commented out).
    # Grafana 13+ treats a provisioned datasource whose plugin is missing as a
    # FATAL provisioning error ("data source not found") and crash-loops. We drop
    # that datasource and keep only the Prometheus-compatible one — VictoriaMetrics
    # speaks the Prometheus API, so every dashboard works, with no boot-time
    # dependency on grafana.com plugin downloads. (Alertmanager datasource is a
    # separate key and stays at chart default.)
    # ---------------------------------------------------------------------------
    defaultDatasources:
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true

    # ---------------------------------------------------------------------------
    # Grafana — dashboards (Zitadel OIDC, credentials from grafana-oidc-secret)
    # ---------------------------------------------------------------------------
    grafana:
      enabled: true
      envFromSecret: grafana-oidc-secret
      persistence:
        enabled: true
        storageClassName: nfs-client
        size: 2Gi
      "grafana.ini":
        server:
          root_url: https://grafana.blackcats.cc
        users:
          auto_assign_org_role: Admin
        auth:
          disable_login_form: false
        auth.generic_oauth:
          enabled: "true"
          name: Keycloak
          allow_sign_up: "true"
          client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid email profile
          auth_url: https://sso.blackcats.cc/realms/homelab/protocol/openid-connect/auth
          token_url: https://sso.blackcats.cc/realms/homelab/protocol/openid-connect/token
          api_url: https://sso.blackcats.cc/realms/homelab/protocol/openid-connect/userinfo
          # Keycloak puts client roles at resource_access.<clientId>.roles.
          # Without this every SSO user lands on auto_assign_org_role (Admin).
          role_attribute_path: "contains(resource_access.grafana.roles[*], 'admin') && 'Admin' || contains(resource_access.grafana.roles[*], 'editor') && 'Editor' || 'Viewer'"
          role_attribute_strict: "false"
          use_pkce: "true"
          auto_login: "false"
      service:
        port: 3000
      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 512Mi
      # The two dashboard/datasource sidecars are separate containers from
      # grafana itself and inherit nothing from the block above -- they ran with
      # no requests at all. One `sidecar.resources` covers both.
      # 30d window: sc-dashboard p90 101/peak 103, sc-datasources p90 89/peak 91.
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi

    # ---------------------------------------------------------------------------
    # VictoriaLogs — not enabled (future work)
    # ---------------------------------------------------------------------------
    vlogs:
      enabled: false

    vlsingle:
      enabled: false

    # ---------------------------------------------------------------------------
    # Bundled exporters
    # ---------------------------------------------------------------------------
    kube-state-metrics:
      enabled: true
      collectors:
        - pods
        - deployments
        - replicasets
        - statefulsets
        - daemonsets
        - nodes
        - namespaces
        - persistentvolumeclaims
        - horizontalpodautoscalers
        - jobs
        - cronjobs
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

    prometheus-node-exporter:
      enabled: true
      # Sized from a 30d VictoriaMetrics window: p90 33, peak 35 MiB. Flat by
      # nature -- it reads /proc and /sys per scrape and holds nothing.
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi

    # Kubelet / API server / etcd scraping
    kubelet:
      enabled: true

    kubeApiServer:
      enabled: true
      # The apiserver /metrics endpoint is the single highest-cardinality scrape and
      # lands CPU on the control plane that is already under leader-election pressure.
      # Scrape it less often (3m) and drop the heaviest histogram buckets.
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              interval: "3m"
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: "apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_response_sizes_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_body_size_bytes_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket"
          jobLabel: component
          namespaceSelector:
            matchNames:
              - default
          selector:
            matchLabels:
              component: apiserver
              provider: kubernetes

    # Control-plane component metrics.
    # cm + scheduler are reachable: --bind-address=0.0.0.0 is set via Talos
    # extraArgs (must also be added to talconfig.yaml so it survives a
    # talhelper regen — applied imperatively 2026-06-03).
    # Talos serves cm/scheduler metrics with a cert valid only for localhost,
    # but vmagent scrapes them by node IP — so skip TLS verification.
    kubeControllerManager:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeScheduler:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    # etcd metrics: Talos serves them plaintext on :2381 via the
    # etcd.extraArgs.listen-metrics-urls set in talconfig.yaml. That arg took
    # effect after a node reboot — verified reachable on all 3 CPs 2026-06-18.
    # Unlike cm/scheduler, etcd runs outside the kubelet on Talos (no static
    # mirror pod), so the chart's pod selector finds nothing — list the
    # control-plane IPs explicitly and scrape :2381 over http (no auth/TLS).
    kubeEtcd:
      enabled: true
      endpoints:
        - 172.16.20.11
        - 172.16.20.12
        - 172.16.20.13
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http

    coreDns:
      enabled: true

    defaultRules:
      # Disable whole built-in rule groups. Keys must match the upstream group
      # name exactly (dots included) — the chart forwards this map to the
      # sync-job, which renders the VMRules and prunes (syncJob.prune defaults
      # to true) any group turned off here.
      groups:
        # Every rule in these four groups is built on
        # apiserver_request_sli_duration_seconds_bucket, which the kubeApiServer
        # scrape above deliberately drops as the single highest-cardinality
        # series on the control plane. The rules therefore evaluate to zero
        # samples forever, and each one fires an (info) RecordingRulesNoData —
        # 13 permanently-firing alerts since the stack was installed, drowning
        # the real ones. kube-apiserver-slos holds KubeAPIErrorBudgetBurn, which
        # reads the (empty) burnrate recordings, so it can never fire: a dead
        # alert is worse than no alert. Re-enable these only together with
        # un-dropping the bucket metric.
        # Cost of turning them off: the chart's `apiserver` Grafana dashboard —
        # already empty on every latency/availability panel for the same reason
        # — also loses its request-rate panel (raw apiserver_request_total is
        # still scraped, so the panel is reconstructable).
        kube-apiserver-availability.rules:
          enabled: false
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false
        # count:up1 / count:up0 only. count:up0 = `count(up == 0)`, which is
        # empty whenever every scrape target is healthy — so a fully-green
        # cluster permanently fires RecordingRulesNoData on it (it did from
        # 2026-08-13). Nothing here consumes either recording (no dashboard, no
        # rule), so the group is pure alert noise.
        kube-prometheus-general.rules:
          enabled: false

      # Disable specific built-in alerts. This chart keys overrides under
      # rules.<AlertName>.enabled — it has NO `disabled:` map (that field is
      # silently ignored, leaving the built-in live alongside the replacement).
      # Both are replaced by tuned custom VMRules in vmrules.yml.
      rules:
        # Built-in has no device exclusions; wt0 (Cilium WireGuard) reports
        # expected TX errors — replaced by node-network-custom.
        NodeNetworkTransmitErrs:
          enabled: false
        # Built-in guards only on in-use bytes > 100 MiB, which flaps at our
        # scale — replaced by size-aware etcd-custom (fires at 1.5 GiB file).
        etcdDatabaseHighFragmentationRatio:
          enabled: false
        KubeMemoryOvercommit:
          spec:
            # Upstream asks "if the largest node dies, do all pod requests still
            # fit?" — it subtracts llm-1's 68.2Gi of capacity while leaving
            # llama-swap's 60Gi request in the numerator. llama-swap can never
            # use cp capacity: it is pinned by nodeSelector to llm-1, tolerates
            # workload=llm:NoSchedule, and its model PVC is node-local RWO
            # openebs-hostpath on llm-1. If llm-1 dies that pod stays Pending by
            # design, so counting its request against the cp nodes is nonsense —
            # the alert fired continuously 2026-09-01..09-13, went quiet only
            # because the stack was scaled to 0, and returned on scale-up.
            #
            # Excluding llm-1 from BOTH sides asks the question that actually
            # matters: can cp-1/2/3 absorb the loss of one cp node? Measured
            # 2026-09-17: 40.2Gi of requests into 57.4Gi surviving allocatable,
            # 17.3Gi spare. Verified against live data with a negative control —
            # the same expression without the node filter still fires at 15.5Gi.
            #
            # Requests mirror the upstream recording rule
            # namespace_memory:kube_pod_container_resource_requests:sum
            # (including its phase=~"Pending|Running" filter, worth 0.7Gi of
            # completed Job pods) because that rule aggregates away `node` and
            # so cannot be filtered. Keep the two in sync if the chart changes.
            # Revisit if llm-1 ever gains a peer that llama-swap could fail over
            # to, or if any other workload is pinned to a single large node.
            expr: >-
              (((sum(max(kube_pod_container_resource_requests{resource="memory",job="kube-state-metrics",node!="llm-1"})
              by(namespace,pod,container,cluster) * on(namespace,pod,cluster)
              group_left() max(kube_pod_status_phase{phase=~"Pending|Running"} ==
              1) by(namespace,pod,cluster)) by(cluster) -
              sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory",node!="llm-1"})
              by(cluster)) > 0) and
              (count(max(kube_node_role{job="kube-state-metrics",role="control-plane"})
              by(cluster,node)) by(cluster) < 3)) or
              ((sum(max(kube_pod_container_resource_requests{resource="memory",job="kube-state-metrics",node!="llm-1"})
              by(namespace,pod,container,cluster) * on(namespace,pod,cluster)
              group_left() max(kube_pod_status_phase{phase=~"Pending|Running"} ==
              1) by(namespace,pod,cluster)) by(cluster) -
              ((sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory",node!="llm-1"})
              by(cluster) -
              max(kube_node_status_allocatable{job="kube-state-metrics",resource="memory",node!="llm-1"})
              by(cluster)) > 0)) > 0)

    # Disable admission webhooks — operator validates CRs in-process without
    # webhooks; disabling avoids the chicken-and-egg where the webhook server
    # isn't ready when the operator CRs are first applied during install.
    victoria-metrics-operator:
      admissionWebhooks:
        enabled: false
      # Sized from a 30d VictoriaMetrics window: p90 138, peak 145 MiB.
      resources:
        requests:
          cpu: 10m
          memory: 176Mi
        limits:
          memory: 352Mi
