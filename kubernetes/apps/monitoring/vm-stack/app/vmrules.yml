---
# Override NodeNetworkTransmitErrs to exclude WireGuard (wt0) and loopback
# interfaces. Default rule has no device exclusions; Cilium WireGuard
# encryption creates wt0 on each node with expected TX errors.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: node-network-custom
  namespace: monitoring
spec:
  groups:
    - name: node-exporter-custom
      rules:
        - alert: NodeNetworkTransmitErrs
          expr: >
            (
              rate(node_network_transmit_errs_total{job="node-exporter",device!~"lo|wt.+|veth.+|docker.+|cali.+|cilium.+"}[2m])
              / rate(node_network_transmit_packets_total{job="node-exporter",device!~"lo|wt.+|veth.+|docker.+|cali.+|cilium.+"}[2m])
            ) > 0.01
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Network interface is reporting many transmit errors.
            description: >
              {{ $labels.instance }} interface {{ $labels.device }} has encountered
              {{ printf "%.0f" $value }} transmit errors in the last two minutes.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodenetworktransmiterrs
---
# Size-aware replacement for the upstream etcdDatabaseHighFragmentationRatio
# (disabled via defaultRules.disabled in helmrelease.yml). The built-in rule
# guards only on in-use bytes > 100 MiB, so at our scale (~220 MB DB file /
# ~95 MB in use against etcd's default 2 GiB quota) it flaps on/off for a
# cosmetic condition — compaction frees pages but doesn't return them to the
# OS; only defrag shrinks the file. Fragmentation only matters as the allocated
# file approaches the quota, so we re-guard on the *total* on-disk size
# (> 1.5 GiB = 75% of the 2 GiB quota), leaving headroom to defrag before
# etcd would go read-only. Remediation: `talosctl etcd defrag`, one node at a
# time, followers first / leader last (keeps quorum 2/3).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: etcd-custom
  namespace: monitoring
spec:
  groups:
    - name: etcd-custom
      rules:
        - alert: etcdDatabaseHighFragmentationRatio
          expr: >
            (
              last_over_time(etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"}[5m])
              / last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m])
            ) < 0.5
            and
            etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"} > 1610612736
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: etcd DB file is over 1.5 GiB and less than 50% in use — defragment before it nears the 2 GiB quota.
            description: >
              etcd cluster "{{ $labels.job }}": the allocated database file on
              {{ $labels.instance }} has grown past 1.5 GiB and only
              {{ $value | humanizePercentage }} of it is in use. Run defragmentation
              (talosctl etcd defrag, one node at a time, followers first / leader
              last) to reclaim space before the file approaches etcd's 2 GiB quota.
            runbook_url: https://etcd.io/docs/v3.5/op-guide/maintenance/#defragmentation
---
# Node and backing-store disk alerts.
#
# Added 2026-08-29. Until then NOTHING in the cluster watched Talos node disk:
# the only alert that happened to cover it was minecraft-monitoring's
# MinecraftWorldVolumeAlmostFull, which read kubelet_volume_stats_* on an
# openebs-hostpath PVC. Because hostpath volumes have no quota, that metric
# reports the node filesystem -- so a full node surfaced as a Minecraft alert,
# and only if it was one of the two nodes holding a world. Those rules now
# measure real world size; node disk belongs here, once per node, named for what
# it is.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: node-disk
  namespace: monitoring
spec:
  groups:
    - name: node-disk
      rules:
        - alert: NodeFilesystemAlmostFull
          # /var is Talos's EPHEMERAL partition: containerd images, etcd,
          # kubelet state, logs and every openebs-hostpath PVC share it. It is
          # the only partition on a Talos node that can actually fill.
          #
          # Threshold sits above the kubelet imageGC high-water mark (70, set in
          # talconfig.yaml) so routine GC churn does not alert -- crossing 80%
          # means GC ran and did not reclaim enough, which is the real signal.
          expr: >
            100 - 100 * node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|nfs.*|squashfs|iso9660"}
            / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|nfs.*|squashfs|iso9660"}
            > 80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Node {{ $labels.instance }} filesystem {{ $labels.mountpoint }} is {{ printf "%.0f" $value }}% full
            description: >
              {{ $labels.mountpoint }} on {{ $labels.instance }} is
              {{ printf "%.0f" $value }}% full. On Talos this partition is shared
              by containerd images, etcd, kubelet state and all openebs-hostpath
              PVCs, so filling it causes DiskPressure evictions rather than a
              clean per-volume error. Check container image accumulation first
              (`crictl images`), then hostpath PVC growth -- note hostpath claims
              are unenforced, so their nominal sizes do not bound this.

        - alert: NodeFilesystemCriticallyFull
          expr: >
            100 - 100 * node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|nfs.*|squashfs|iso9660"}
            / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|nfs.*|squashfs|iso9660"}
            > 90
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Node {{ $labels.instance }} filesystem {{ $labels.mountpoint }} is {{ printf "%.0f" $value }}% full
            description: >
              {{ $labels.mountpoint }} on {{ $labels.instance }} is
              {{ printf "%.0f" $value }}% full. The kubelet starts evicting pods
              at its DiskPressure threshold; etcd goes read-only if it cannot
              write. Reclaim space now.

        - alert: SynologyShareAlmostFull
          # The Synology exports no node_exporter, so the only in-cluster view of
          # /volume2 free space is kubelet_volume_stats on an nfs-client PVC --
          # which reports the whole backing share rather than the claim. That is
          # the wrong number for per-PVC alerting but exactly the right one here.
          #
          # Pinned to a single representative claim on purpose: all ~34 nfs-client
          # PVCs report identical figures, so an unpinned selector would fire ~34
          # duplicate notifications for one condition.
          expr: >
            100 - 100 * kubelet_volume_stats_available_bytes{persistentvolumeclaim="mc-backups"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="mc-backups"}
            > 85
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Synology /volume2 is {{ printf "%.0f" $value }}% full
            description: >
              The Synology volume backing every nfs-client PVC and the media share
              is {{ printf "%.0f" $value }}% full. Measured via the mc-backups
              claim, which reports the backing share -- this is about /volume2 as
              a whole, not that one PVC. Check Media/ growth and restic staging
              under backups/.
