---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/gatus.db

    web:
      port: 8080

    ui:
      title: Homelab Status
      header: Homelab Status

    alerting:
      gotify:
        server-url: http://gotify.monitoring.svc.cluster.local
        token: "${GOTIFY_TOKEN}"
        default-alert:
          enabled: true
          failure-threshold: 2
          success-threshold: 2

    endpoints:
      - name: Homepage
        group: infrastructure
        url: https://home.example.com
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Gotify
        group: infrastructure
        url: https://gotify.example.com/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Zitadel
        group: infrastructure
        url: https://zitadel.example.com/debug/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Gitea
        group: infrastructure
        url: https://gitea.example.com
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Goldilocks
        group: infrastructure
        url: https://goldilocks.example.com
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Immich
        group: apps
        url: https://immich.example.com/api/server/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].res == pong"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Paperless
        group: apps
        url: https://paperless.example.com
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: FreshRSS
        group: apps
        url: https://rss.example.com
        interval: 1m
        conditions:
          - "[STATUS] == 401"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Homebox
        group: apps
        url: https://homebox.example.com
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Degoog
        group: apps
        url: https://degoog.example.com
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Plex
        group: media
        url: https://plex.example.com/identity
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Sonarr
        group: media
        url: https://sonarr.example.com/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Radarr
        group: media
        url: https://radarr.example.com/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Prowlarr
        group: media
        url: https://prowlarr.example.com/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: SABnzbd
        group: media
        url: https://nzb.example.com
        interval: 1m
        conditions:
          - "[STATUS] < 400"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Seerr
        group: media
        url: https://seerr.example.com/api/v1/status
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Suwayomi
        group: media
        url: https://suwayomi.example.com
        interval: 1m
        conditions:
          - "[STATUS] < 400"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Kavita
        group: media
        url: https://kavita.example.com/api/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # Minecraft is raw TCP through mc-router, not HTTP through the Gateway —
      # hence tcp:// and no certificate condition. Using the public hostname on
      # purpose: this exercises the whole path a player takes (Cloudflare DNS →
      # 172.16.20.51 → mc-router → backend), which the in-cluster mc-monitor
      # scrape deliberately bypasses.
      - name: Minecraft (matcha)
        group: media
        url: "tcp://matcha.example.com:25565"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"

      - name: Minecraft (vanilla)
        group: media
        url: "tcp://vanilla.example.com:25565"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"

      # The Minecraft web companions, checked over HTTPS through the Gateway —
      # a different path entirely from the tcp:// checks above, which go via
      # mc-router on 172.16.20.51. Both can fail independently: squaremap runs
      # inside the server JVM (so it dies with the server), while filebrowser is
      # a sidecar with publishNotReadyAddresses and stays up when the server is
      # down. 5m interval — these are conveniences, not the game itself.
      - name: Minecraft map (matcha)
        group: media
        url: https://matcha-map.example.com
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Minecraft map (vanilla)
        group: media
        url: https://vanilla-map.example.com
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # filebrowser serves its login page unauthenticated at 200, so no
      # credentials are needed to prove it is alive.
      - name: Minecraft files (matcha)
        group: media
        url: https://matcha-files.example.com
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Minecraft files (vanilla)
        group: media
        url: https://vanilla-files.example.com
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"
