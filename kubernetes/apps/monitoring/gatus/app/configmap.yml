---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/gatus.db

    web:
      port: 8080

    ui:
      title: Homelab Status
      header: Homelab Status

    alerting:
      gotify:
        server-url: http://gotify.monitoring.svc.cluster.local
        token: "${GOTIFY_TOKEN}"
        default-alert:
          enabled: true
          failure-threshold: 2
          success-threshold: 2

    endpoints:
      - name: Homepage
        group: infrastructure
        url: https://home.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Gotify
        group: infrastructure
        url: https://gotify.blackcats.cc/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # Keycloak's own /health lives on the management port 9000, which the
      # Gateway does not route — so probe the realm's discovery document instead.
      # It is the exact endpoint every OIDC app fetches, so a 200 here means SSO
      # actually works, not merely that the pod answers.
      - name: Keycloak
        group: infrastructure
        url: https://sso.blackcats.cc/realms/homelab/.well-known/openid-configuration
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Zitadel
        group: infrastructure
        url: https://zitadel.blackcats.cc/debug/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Gitea
        group: infrastructure
        url: https://gitea.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # git-over-SSH rides a separate Gateway listener (TCP:22 -> TCPRoute) from
      # the HTTPS check above, so a healthy web UI says nothing about whether
      # `git clone git@gitea.blackcats.cc:...` works. Probe the public path.
      - name: Gitea SSH
        group: infrastructure
        url: "tcp://gitea.blackcats.cc:22"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"

      - name: Goldilocks
        group: infrastructure
        url: https://goldilocks.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # kromgo renders the public README's badges. Nothing else notices when it
      # dies -- the badges just go stale -- so this is the only signal. 5m: it is
      # cosmetic, not load-bearing.
      - name: Kromgo
        group: infrastructure
        url: https://kromgo.blackcats.cc
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # No [CERTIFICATE_EXPIRATION] here on purpose: this is the only endpoint
      # with a [BODY] condition, so gatus drains the response and keeps the
      # connection pooled, then reports the cert from the FIRST handshake
      # forever. After a shared-tls renewal it reads the old expiry and goes
      # red while immich is healthy. The wildcard is covered by every other
      # endpoint below, so dropping it here loses no coverage.
      - name: Immich
        group: apps
        url: https://immich.blackcats.cc/api/server/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].res == pong"

      - name: Paperless
        group: apps
        url: https://paperless.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: FreshRSS
        group: apps
        url: https://rss.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 401"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Homebox
        group: apps
        url: https://homebox.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Degoog
        group: apps
        url: https://degoog.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # `/` answers 200 with no password set and 302 once one is, so this
      # asserts < 400 rather than == 200 -- otherwise enabling the built-in
      # password would silently turn this check red.
      - name: Changedetection
        group: apps
        url: https://changedetection.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] < 400"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # CouchDB is Obsidian LiveSync's backend, not a UI -- `/` is the server
      # welcome document and answers 401 because config-configmap.yml sets
      # require_valid_user = true under both [chttpd] and [chttpd_auth]. A 401
      # therefore proves CouchDB is up and enforcing auth; a 200 would mean the
      # database had been thrown open.
      - name: Obsidian LiveSync
        group: apps
        url: https://obsidian.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] == 401"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Open WebUI
        group: apps
        url: https://chat.blackcats.cc/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # /health needs the master key; /health/liveliness is the unauthenticated
      # one. It only proves the LiteLLM process is up -- it does NOT reach
      # llama-swap, so a dead model backend still shows green here. The
      # ai-monitoring VMRules cover that side.
      - name: LiteLLM
        group: apps
        url: https://llm.blackcats.cc/health/liveliness
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Plex
        group: media
        url: https://plex.blackcats.cc/identity
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # Jellyfin's /health returns non-200 while startup migrations run, which is
      # exactly the window its startup probe is built to tolerate. The 2-failure
      # default threshold plus a 1m interval means a long migration can page --
      # that is intentional: a 12.x library conversion is worth knowing about.
      - name: Jellyfin
        group: media
        url: https://jellyfin.blackcats.cc/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Sonarr
        group: media
        url: https://sonarr.blackcats.cc/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Radarr
        group: media
        url: https://radarr.blackcats.cc/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Prowlarr
        group: media
        url: https://prowlarr.blackcats.cc/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: SABnzbd
        group: media
        url: https://nzb.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] < 400"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Seerr
        group: media
        url: https://seerr.blackcats.cc/api/v1/status
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Suwayomi
        group: media
        url: https://suwayomi.blackcats.cc
        interval: 1m
        conditions:
          - "[STATUS] < 400"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Kavita
        group: media
        url: https://kavita.blackcats.cc/api/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: RomM
        group: media
        url: https://romm.blackcats.cc/api/heartbeat
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # Minecraft is raw TCP through the Velocity proxy, not HTTP through the
      # Gateway — hence tcp:// and no certificate condition. Using the public
      # hostname on purpose: this exercises the whole path a player takes
      # (Cloudflare DNS → 172.16.20.52 → Velocity → backend), which the
      # in-cluster mc-monitor scrape deliberately bypasses.
      - name: Minecraft (matcha)
        group: media
        url: "tcp://matcha.blackcats.cc:25565"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"

      - name: Minecraft (vanilla)
        group: media
        url: "tcp://vanilla.blackcats.cc:25565"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"

      # The Minecraft web companions, checked over HTTPS through the Gateway —
      # a different path entirely from the tcp:// checks above, which go via
      # the Velocity proxy on 172.16.20.52. Both can fail independently: squaremap runs
      # inside the server JVM (so it dies with the server), while filebrowser is
      # a sidecar with publishNotReadyAddresses and stays up when the server is
      # down. 5m interval — these are conveniences, not the game itself.
      - name: Minecraft map (matcha)
        group: media
        url: https://matcha-map.blackcats.cc
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Minecraft map (vanilla)
        group: media
        url: https://vanilla-map.blackcats.cc
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      # filebrowser serves its login page unauthenticated at 200, so no
      # credentials are needed to prove it is alive.
      - name: Minecraft files (matcha)
        group: media
        url: https://matcha-files.blackcats.cc
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"

      - name: Minecraft files (vanilla)
        group: media
        url: https://vanilla-files.blackcats.cc
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"
