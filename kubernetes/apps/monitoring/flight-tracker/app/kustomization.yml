---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yml
  - ./deployment.yml
  - ./aerodatabox-sealed.yml
configMapGenerator:
  - name: flight-tracker-script
    namespace: monitoring   # must match the Deployment's namespace or the hashed name is not propagated
    files:
      - alerts.py
      - core.py
      - flights.py
      - main.py
      - status.py
