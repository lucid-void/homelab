---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-tracker
  namespace: monitoring
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate   # one getUpdates consumer at a time; RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: flight-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flight-tracker
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: flight-tracker-script
        - name: data
          persistentVolumeClaim:
            claimName: flight-tracker-data
        - name: tmp
          emptyDir: {}
      containers:
        - name: tracker
          image: python:3.14.7-alpine3.24
          command: ["python", "-u", "/scripts/main.py"]
          env:
            - name: STATE_PATH
              value: /data/state.json
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - secretRef:
                name: telegram-secret
            - secretRef:
                name: aerodatabox-secret
            - secretRef:
                name: gotify-client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
