---
# Selects on monitoring.blackcats.cc/scrape rather than app.kubernetes.io/name,
# because Flux commonMetadata rewrites the latter on every resource.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tdarr
  namespace: monitoring
spec:
  selector:
    matchLabels:
      monitoring.blackcats.cc/scrape: tdarr
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
