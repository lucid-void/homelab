---
# Selects on monitoring.${CLUSTER_DOMAIN}/scrape rather than app.kubernetes.io/name,
# because Flux commonMetadata rewrites the latter on every resource.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tdarr
  namespace: monitoring
spec:
  selector:
    matchLabels:
      monitoring.${CLUSTER_DOMAIN}/scrape: tdarr
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      # The exporter calls Tdarr live on every scrape; the 10s default times out
      # whenever the Tdarr API is slow (its DB is on NFS).
      scrapeTimeout: 50s
