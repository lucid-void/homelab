---
# Minecraft alerts. Route through Alertmanager → am-gotify-bridge → Gotify,
# same path as proxmox-host.
#
# Metric sources:
#   minecraft_status_*  → mc-monitor (:8080), protocol-level server ping
#   (Velocity exports no metrics; proxy health comes from mc-monitor
#    pinging minecraft-proxy, see mc-monitor.yml)
#   container_*         → cAdvisor via kubelet scrape
#   kube_*              → kube-state-metrics (vm-stack)
#   kubelet_volume_*    → kubelet, PVC capacity
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: minecraft
  namespace: monitoring
spec:
  groups:
    # -----------------------------------------------------------------------
    # Availability
    # -----------------------------------------------------------------------
    - name: minecraft-availability
      rules:
        - alert: MinecraftServerDown
          # Protocol-level: the server is not answering a Server List Ping, which
          # is exactly what a player's client sees. Catches a wedged JVM that the
          # pod's own probes might still call alive.
          expr: minecraft_status_healthy{server_host!~".*minecraft-proxy.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Minecraft server {{ $labels.server_host }} is not responding
            description: >
              {{ $labels.server_host }} has failed Server List Ping for 5m.
              Players cannot connect. Check the pod in the media namespace and
              its startup logs — world generation and plugin downloads can take
              several minutes after a restart.

        - alert: MinecraftExporterDown
          expr: up{job=~".*mc-monitor.*"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Minecraft monitoring target {{ $labels.job }} is down
            description: >
              Scrape target {{ $labels.job }} has been unreachable for 10m —
              Minecraft alerting is blind until it returns. The servers
              themselves may still be fine.

        - alert: MinecraftProxyDown
          # Velocity is a single point of failure for BOTH servers: it owns
          # 172.16.20.52:25565 and every client connection passes through it.
          # It publishes no metrics, so this is a protocol-level ping of the
          # proxy itself — if this fires while MinecraftServerDown is quiet, the
          # backends are healthy and the proxy is the fault.
          expr: minecraft_status_healthy{server_host=~".*minecraft-proxy.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Minecraft proxy is down — both servers unreachable
            description: >
              Velocity has failed Server List Ping for 5m. matcha and vanilla are
              unreachable regardless of their own health, because every client
              connection is proxied through it. Backends can still be reached
              in-cluster at {matcha,vanilla}-app.media.svc for triage.

    # -----------------------------------------------------------------------
    # Performance — the closest proxies for tick health available without a
    # server-side plugin (see mc-monitor.yml for why there isn't one).
    # -----------------------------------------------------------------------
    - name: minecraft-performance
      rules:
        - alert: MinecraftServerSlowPing
          # The ping is answered on the main thread, so a sustained slow reply
          # means the tick loop is behind — the symptom players experience as
          # rubber-banding. Cross-check against MinecraftWorldVolumeAlmostFull
          # and container CPU before blaming the world.
          expr: minecraft_status_response_time_seconds > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Minecraft server {{ $labels.server_host }} responding slowly
            description: >
              Server List Ping for {{ $labels.server_host }} has taken
              {{ $value | humanizeDuration }} (>1s) for 10m. The main tick loop
              is likely saturated — check container CPU and whether a large
              chunk-loading event (new player exploring, worldgen) is in progress.

        - alert: MinecraftMemoryNearLimit
          # The JVM heap is fixed by MEMORY; this watches the container ceiling,
          # which must stay above heap + metaspace/GC/direct buffers. Crossing it
          # means an OOMKill, not a GC pause.
          # metrics_path is load-bearing: the kubelet exports
          # container_memory_working_set_bytes from BOTH /metrics/cadvisor and
          # /metrics/resource, so an unfiltered selector matches two identical
          # series per pod and every alert is delivered twice (seen in Gotify
          # 2026-08-03/04 as near-simultaneous duplicate pairs).
          expr: >
            container_memory_working_set_bytes{namespace="media",pod=~"matcha-.*|vanilla-.*",container="app",metrics_path="/metrics/cadvisor"}
            / on(pod) group_left
            kube_pod_container_resource_limits{namespace="media",resource="memory",container="app"}
            > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Minecraft pod {{ $labels.pod }} near its memory limit
            description: >
              {{ $labels.pod }} is at {{ $value | humanizePercentage }} of its
              memory limit for 15m. The JVM will be OOMKilled rather than GC'd if
              it crosses. Either lower MEMORY (heap) or raise the container limit —
              the limit must exceed the heap by roughly 1.5Gi.

    # -----------------------------------------------------------------------
    # Storage
    #
    # These alerts deliberately do NOT use kubelet_volume_stats_*. That metric
    # family is meaningless for both of this stack's volume types:
    #
    #   * matcha-data / vanilla-data are openebs-hostpath -- a plain directory on
    #     the node EPHEMERAL partition with no quota, so the kubelet reports the
    #     NODE filesystem. Both PVCs report identical numbers (~97Gi capacity),
    #     which is cp-N's /var shared with containerd, etcd and logs.
    #   * mc-backups is nfs-client, so it reports the whole ~21TiB Synology
    #     volume, not the backup directory.
    #
    # The previous MinecraftWorldVolumeAlmostFull/MinecraftBackupVolumeAlmostFull
    # pair alerted on those numbers under Minecraft names. They fired on causes
    # that had nothing to do with Minecraft (the one real investigation traced a
    # firing alert to ~30GB of unused container images against ~1.4GB of world)
    # and could never have caught a world growing on its own. Worse, because both
    # world PVCs resolve to the same node filesystem, one full node produced two
    # identical alerts.
    #
    # World size now comes from a real `du` in the world-size sidecar, and node
    # disk has its own honest alert in the vm-stack rules. Note there is no
    # "world exceeded its claim" alert, because there is no claim to exceed --
    # the 20Gi in pvc.yml is advisory, unenforced by openebs-hostpath.
    # -----------------------------------------------------------------------
    - name: minecraft-storage
      rules:
        - alert: MinecraftWorldGrowingFast
          # Worlds grow with exploration, not playtime, so a sudden climb means
          # someone is running a chunk-generating trip (elytra, new dimension) or
          # a chunk-loader is stuck. Catching the RATE is what gives useful
          # warning; the absolute-size alert below is the backstop.
          expr: >
            increase(minecraft_server_data_size_bytes[6h]) > 2 * 1024 * 1024 * 1024
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Minecraft server {{ $labels.server }} data grew {{ $value | humanize1024 }}B in 6h
            description: >
              {{ $labels.server }} has added {{ $value | humanize1024 }}B of world
              data in six hours. This volume is node-local openebs-hostpath with
              no quota, so it competes with containerd and etcd for the node
              filesystem -- sustained growth ends in DiskPressure eviction, not a
              clean "volume full" error. Constrain with /worldborder, or check for
              a stuck chunk-loader.

        - alert: MinecraftWorldLarge
          # Absolute backstop. 20Gi is the (unenforced) claim in pvc.yml, so
          # crossing 15Gi means the advisory number is about to stop being a
          # useful description of reality.
          expr: minecraft_server_data_size_bytes > 15 * 1024 * 1024 * 1024
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Minecraft server {{ $labels.server }} data is {{ $value | humanize1024 }}B
            description: >
              {{ $labels.server }} now holds {{ $value | humanize1024 }}B, past the
              15Gi mark against a nominal 20Gi claim. That claim is advisory --
              openebs-hostpath enforces no quota -- so the real ceiling is node
              free space. Recreating the PVC larger does not help either; plan a
              /worldborder trim or a world reset.

        - alert: MinecraftWorldSizeExporterStale
          # The whole point of the rules above is that they use a real
          # measurement, so a silently dead exporter must not read as "no growth".
          # The sidecar scans every 300s; 30m of staleness is six missed scans.
          expr: >
            time() - minecraft_world_size_last_scan_timestamp_seconds > 1800
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Minecraft world-size exporter for {{ $labels.server }} is stale
            description: >
              The last completed scan for {{ $labels.server }} was
              {{ $value | humanizeDuration }} ago (expected every 5m). The
              MinecraftWorldGrowingFast and MinecraftWorldLarge alerts are blind
              until this recovers -- check the `world-size` container in the
              {{ $labels.server }} pod.
