---
# Minecraft server dashboard. Auto-loaded by the Grafana sidecar
# (label grafana_dashboard: "1"), same as the proxmox and control-plane boards.
#
# Layout follows the triage order: is it up → are players on → is it lagging →
# is it running out of something.
#
# NOTE: the mc_router_* series in the last panel are the one unverified part —
# Velocity publishes no Prometheus metrics, so every panel here is fed by
# mc-monitor's protocol-level pings. Confirm metric names after deploy and
# correct the exprs if they differ; an empty panel is the only failure mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-minecraft
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  minecraft.json: "{\n  \"uid\": \"minecraft\",\n  \"title\": \"Minecraft\",\n  \"tags\": [\n    \"minecraft\",\n    \"media\",\n    \"games\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"1m\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"datasource\",\n        \"label\": \"Data source\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n        \"current\": {\n          \"text\": \"VictoriaMetrics\",\n          \"value\": \"VictoriaMetrics\"\n        },\n        \"hide\": 0,\n        \"refresh\": 1\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Server status\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"0\": {\n                  \"text\": \"DOWN\",\n                  \"color\": \"red\"\n                },\n                \"1\": {\n                  \"text\": \"UP\",\n                  \"color\": \"green\"\n                }\n              }\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"minecraft_status_healthy\",\n          \"legendFormat\": \"{{server_host}}\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Players online\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 8,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"text\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"minecraft_status_players_online_count\",\n          \"legendFormat\": \"{{server_host}}\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Server version\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 0\n      },\n      \"options\": {\n        \"colorMode\": \"none\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"minecraft_status_healthy == 1\",\n          \"legendFormat\": \"{{server_host}} \\u2014 {{server_version}}\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Players online over time\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 20,\n            \"lineInterpolation\": \"stepAfter\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"minecraft_status_players_online_count\",\n          \"legendFormat\": \"{{server_host}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Ping response time (tick-loop health proxy)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"The Server List Ping is answered on the main thread, so sustained high values mean the tick loop is behind. No true TPS metric exists without a server-side plugin \\u2014 see mc-monitor.yml.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 0.5\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"minecraft_status_response_time_seconds\",\n          \"legendFormat\": \"{{server_host}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"title\": \"CPU usage\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 13\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"media\\\",pod=~\\\"matcha-.*|vanilla-.*\\\",container=\\\"app\\\"}[5m]))\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Memory vs limit\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Container working set against the limit. Crossing the limit is an OOMKill, not a GC pause \\u2014 the limit must stay well above the JVM heap set by MEMORY.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 13\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"min\": 0,\n          \"max\": 1,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.9\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"container_memory_working_set_bytes{namespace=\\\"media\\\",pod=~\\\"matcha-.*|vanilla-.*\\\",container=\\\"app\\\"} / on(pod) group_left kube_pod_container_resource_limits{namespace=\\\"media\\\",resource=\\\"memory\\\",container=\\\"app\\\"}\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Volume usage (worlds + backup landing zone)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"World PVCs are node-local openebs-hostpath and cannot be expanded in place.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 21\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"min\": 0,\n          \"max\": 1,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 0.85\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.95\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"1 - (kubelet_volume_stats_available_bytes{namespace=\\\"media\\\",persistentvolumeclaim=~\\\"matcha-data|vanilla-data|mc-backups\\\"} / kubelet_volume_stats_capacity_bytes{namespace=\\\"media\\\",persistentvolumeclaim=~\\\"matcha-data|vanilla-data|mc-backups\\\"})\",\n          \"legendFormat\": \"{{persistentvolumeclaim}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 9,\n      \"title\": \"Container restarts (1h)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 21\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"bars\",\n            \"fillOpacity\": 60\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 3\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"increase(kube_pod_container_status_restarts_total{namespace=\\\"media\\\",pod=~\\\"matcha-.*|vanilla-.*\\\"}[1h])\",\n          \"legendFormat\": \"{{pod}}/{{container}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 10,\n      \"title\": \"Proxy \\u2014 reachability and players via Velocity\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Velocity exports no Prometheus metrics, so the proxy is observed by protocol-level ping from mc-monitor. healthy=0 here with the backends healthy means the proxy is the fault. Player counts are per backend.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 29\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"min\": 0,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"minecraft_status_healthy{server_host=~\\\".*minecraft-proxy.*\\\"}\",\n          \"legendFormat\": \"proxy reachable\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"sum(minecraft_status_players_online_count{server_host!~\\\".*minecraft-proxy.*\\\"})\",\n          \"legendFormat\": \"players online (all servers)\",\n          \"refId\": \"B\"\n        }\n      ]\n    }\n  ]\n}"
