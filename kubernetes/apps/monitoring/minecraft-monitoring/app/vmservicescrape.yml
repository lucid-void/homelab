---
# vmagent runs with selectAllByDefault, so these are picked up without touching
# the vm-stack HelmRelease (same mechanism as proxmox-monitoring's VMStaticScrape).
#
# Selectors key off monitoring.blackcats.cc/scrape rather than
# app.kubernetes.io/name, because Flux commonMetadata rewrites the latter on
# every resource in a Kustomization.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: mc-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      monitoring.blackcats.cc/scrape: mc-monitor
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
---
# World-size exporter, one sidecar per game pod (kubernetes/apps/media/minecraft/).
# Cross-namespace: the Services live in `media` while this CR lives in
# `monitoring`, so namespaceSelector is required -- without it the selector is
# scoped to `monitoring` and silently matches nothing.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: minecraft-world-size
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - media
  selector:
    matchLabels:
      monitoring.blackcats.cc/scrape: minecraft-world-size
  endpoints:
    - port: metrics
      path: /metrics
      # The exporter rescans every 300s, so anything faster just re-serves the
      # same cached numbers. World growth is a days-to-weeks signal.
      interval: 120s
