---
# vmagent runs with selectAllByDefault, so these are picked up without touching
# the vm-stack HelmRelease (same mechanism as proxmox-monitoring's VMStaticScrape).
#
# Selectors key off monitoring.blackcats.cc/scrape rather than
# app.kubernetes.io/name, because Flux commonMetadata rewrites the latter on
# every resource in a Kustomization.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: mc-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      monitoring.blackcats.cc/scrape: mc-monitor
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
