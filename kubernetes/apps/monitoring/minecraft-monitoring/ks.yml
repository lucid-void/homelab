---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft-monitoring
  namespace: flux-system
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Needs the VictoriaMetrics operator CRDs (VMServiceScrape / VMRule) from
  # vm-stack. minecraft is not a hard dependency — mc-monitor simply reports the
  # servers unhealthy until they exist, which is the correct behaviour.
  dependsOn:
    - name: vm-stack
  path: ./kubernetes/apps/monitoring/minecraft-monitoring/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 10m
