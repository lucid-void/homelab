---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./scrape.yml
  - ./grafana-datasource-blocky-logs-sealed.yml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
# Not named .json: CI's kubeconform parses every .json under kubernetes/.
configMapGenerator:
  - name: grafana-dashboard-blocky
    files:
      - blocky.json=./blocky.dashboard
  - name: grafana-dashboard-blocky-query
    files:
      - blocky-query.json=./blocky-query.dashboard
