---
# No postBuild substitution: the dashboards are full of Grafana $variables.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dns-monitoring
  namespace: flux-system
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: vm-stack
    - name: sealed-secrets
  path: ./kubernetes/apps/monitoring/dns-monitoring/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  timeout: 10m
