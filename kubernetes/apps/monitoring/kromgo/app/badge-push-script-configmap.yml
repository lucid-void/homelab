---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kromgo-badge-push-script
  namespace: monitoring
data:
  push.sh: |
    #!/bin/bash
    set -euo pipefail

    KROMGO="http://kromgo.monitoring.svc.cluster.local:8080"
    BADGES="nodes pods uptime"

    # Collect every badge FIRST, then push once. A per-badge push would leave
    # the gist half-updated when kromgo returns an error mid-loop, and a stale
    # badge is far less confusing than three badges disagreeing about when
    # they were taken.
    files="{}"
    for id in ${BADGES}; do
      body=$(curl -fsS --max-time 20 "${KROMGO}/badges/${id}?format=shields")

      # kromgo answers 200 with an error payload when a query returns no
      # series, so a schemaVersion check is the real success test, not the
      # HTTP status.
      echo "${body}" | jq -e '.schemaVersion' >/dev/null

      files=$(jq -c --arg name "${id}.json" --arg content "${body}" \
        '.[$name] = {content: $content}' <<<"${files}")
      echo "collected ${id}: $(jq -r '.message' <<<"${body}")"
    done

    curl -fsS --max-time 30 -X PATCH "https://api.github.com/gists/${GIST_ID}" \
      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
      -H "Accept: application/vnd.github+json" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      -d "$(jq -c --argjson files "${files}" -n '{files: $files}')" >/dev/null

    echo "pushed ${BADGES} to gist ${GIST_ID}"
