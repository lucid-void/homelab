---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coverage-audit
  namespace: monitoring
---
# Read-only, and no Secrets: routes, PVCs and CronJobs cluster-wide, plus the two
# ConfigMaps named below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coverage-audit
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coverage-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coverage-audit
subjects:
  - kind: ServiceAccount
    name: coverage-audit
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coverage-audit
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gatus-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coverage-audit
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coverage-audit
subjects:
  - kind: ServiceAccount
    name: coverage-audit
    namespace: monitoring
---
# The Homepage chart renders services.yaml into the `homepage` ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coverage-audit
  namespace: homepage
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["homepage"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coverage-audit
  namespace: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coverage-audit
subjects:
  - kind: ServiceAccount
    name: coverage-audit
    namespace: monitoring
