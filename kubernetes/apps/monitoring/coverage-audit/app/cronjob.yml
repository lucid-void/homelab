---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coverage-audit
  namespace: monitoring
  annotations:
    # deliberate: the TTL always wins for a daily job, and the history limits remain a
    # cap. Same reasoning as sso-audit.
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "deliberate - see comment"
spec:
  schedule: "30 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: coverage-audit
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: audit
              image: python:3.15.2-alpine3.24
              command: ["python3", "/app/main.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: GOTIFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: coverage-audit-gotify-secret
                      key: GOTIFY_TOKEN
                      optional: true
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  memory: 32Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: coverage-audit-script
                defaultMode: 0444
