---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich-database
  namespace: flux-system
spec:
  targetNamespace: postgres
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: postgres-cluster
    - name: sealed-secrets
  path: ./kubernetes/apps/immich/database/app
  prune: true
  # extensions-job is a Job and a Job's pod template is immutable, so editing it
  # while the old Job is still present fails the dry-run with "field is immutable".
  # Safe to delete+recreate: creating the extensions is idempotent.
  # See design/decisions/flux.md.
  force: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  timeout: 5m
