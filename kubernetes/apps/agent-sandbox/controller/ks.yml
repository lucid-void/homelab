---
# kubernetes-sigs/agent-sandbox controller and CRDs (Sandbox, plus the
# SandboxTemplate/Claim/WarmPool extensions, unused for now). Its only consumer
# is the Hermes sandbox: kubernetes/apps/hermes/sandbox/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agent-sandbox
  namespace: flux-system
spec:
  # No targetNamespace: upstream names agent-sandbox-system itself and ships
  # cluster-scoped CRDs and RBAC. No commonMetadata, same reasoning as
  # keycloak-operator: relabelling upstream CRDs buys nothing.
  interval: 1h
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: agent-sandbox
  wait: true
  timeout: 5m
  patches:
    # Upstream's k8s/controller.yaml carries `image: ko://...`, which only
    # their release tooling replaces. Keep this tag equal to the GitRepository
    # ref in kubernetes/flux/repositories/git/agent-sandbox.yml.
    - target:
        kind: Deployment
        name: agent-sandbox-controller
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: agent-sandbox-controller
          namespace: agent-sandbox-system
        spec:
          template:
            spec:
              containers:
                - name: agent-sandbox-controller
                  image: registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.12
