---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: changedetection-backup
  namespace: changedetection
  annotations:
    # deliberate: the TTL and the history limits are complementary here, not
    # conflicting. Whichever fires first removes the Job, and three runs of a
    # daily job cannot accumulate inside 24h -- so the TTL always wins and the
    # limits remain a cap. Without it a failed Job lingers until three MORE
    # failures evict it, re-firing KubeJobFailed indefinitely.
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "deliberate - see comment"
    # restic and rclone need a writable HOME for their cache
    ignore-check.kube-linter.io/no-read-only-root-fs: "restic/rclone cache"
spec:
  # 01:30 -- the free slot between etcd-snapshot (01:00) and homebox (02:00).
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      # Self-clean after 24h. failedJobsHistoryLimit alone retains a failed
      # Job until three MORE failures evict it, so one rare failure leaves the
      # object sitting there and KubeJobFailed re-fires ~twice a day forever.
      # Nothing is lost: the script's own Gotify ✗ notification carries the
      # log tail and persists in Gotify independently of this object.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: changedetection-backup
          restartPolicy: Never
          # nfs-client is RWO, so this Job must land on the node already
          # holding the claim -- otherwise the mount blocks until the app pod
          # it just scaled down releases it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: changedetection
                      app.kubernetes.io/component: app
                  topologyKey: kubernetes.io/hostname
          # Must run as root, unlike every other backup job. changedetection.io
          # itself runs as root (no USER, ignores PUID/PGID) and writes its
          # entire datastore -- the index plus every watch.json/tag.json and
          # snapshot .txt -- via Python tempfile+os.replace(), which defaults
          # to mode 0600. That is nearly the whole tree, not excludable
          # derived data like Paperless's search index, so uid 65534 fails
          # restic backup with "permission denied" on ~45 files, exit 3, and
          # set -e aborts before forget/check run. Confirmed 2026-09-25: read
          # fails as 65534, succeeds as 0, and NFS is not root-squashing it.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: changedetection-data
                readOnly: true
            - name: rclone-config
              secret:
                secretName: rclone-secret
                defaultMode: 0440
            - name: script
              configMap:
                name: changedetection-backup-script
                defaultMode: 0755
          containers:
            - name: backup
              image: ghcr.io/lucid-void/backup-tools:v1.1.0
              command: ["/bin/bash", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: restic-secret
                - secretRef:
                    name: gotify-secret
                    optional: true
              env:
                - name: RCLONE_CONFIG
                  value: /rclone-config/rclone.conf
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: rclone-config
                  mountPath: /rclone-config
                  readOnly: true
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 512Mi
