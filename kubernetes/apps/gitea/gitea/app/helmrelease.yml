---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m
  chart:
    spec:
      chart: gitea
      version: "12.7.0"
      sourceRef:
        kind: HelmRepository
        name: gitea-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: gitea-helm-values
      valuesKey: values.yaml
    - kind: Secret
      name: gitea-oidc-secret
      valuesKey: values.yaml
  values:
    # Disable bundled databases
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false

    # Bundled cache. Chart v11 RENAMED this dependency `redis-cluster` ->
    # `valkey-cluster`; the old key is not in values.yaml at all, so a leftover
    # `redis-cluster.enabled: false` is a silent no-op and the cluster deploys
    # anyway (it defaults to enabled). Always set the CURRENT key explicitly.
    #
    # `cluster.nodes` is the TOTAL pod count including replicas
    # (nodes = primaries + primaries * replicas), so 3 primaries each with one
    # replica = 6. The chart's own default (nodes: 3 / replicas: 0) is 3
    # primaries with NO failover: losing one primary drops its hash slots,
    # `cluster_state` goes to fail, and gitea hard-fails on cache/session/queue.
    valkey-cluster:
      enabled: true
      cluster:
        nodes: 6
        replicas: 1
      # Sized from a 30d VictoriaMetrics peak of 32Mi per node. The Bitnami
      # subchart's default `resourcesPreset` reserved 128Mi x 6 pods = 768Mi of
      # scheduler capacity for a workload that never exceeded 32Mi -- gitea's
      # cache, session and queue are all tiny. Request is 2x observed peak and
      # the limit 4x, so a queue backlog still has headroom. Setting `resources`
      # makes the subchart ignore `resourcesPreset` entirely (including the
      # ephemeral-storage numbers the preset also carried).
      # Note the nesting: the Bitnami subchart puts its node config under its own
      # `valkey` key, so the path is `valkey-cluster.valkey.resources`. Setting a
      # bare `valkey-cluster.resources` renders no error and changes nothing --
      # the preset silently stays in effect. Verify with `helm template`.
      valkey:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
    valkey:
      enabled: false

    persistence:
      enabled: true
      existingClaim: gitea-data

    ingress:
      enabled: false

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 22

    # Sized from VictoriaMetrics, NOT from Goldilocks. The previous 1Gi was set
    # against a "Goldilocks/VPA steady-state target ~422Mi" that was never a
    # measurement: there is no metrics-server in this cluster, so the VPA
    # recommender ingests nothing (`Cannot get ContainerMetricsSnapshot ... get
    # pods.metrics.k8s.io`) and emits its configured floors. gitea has a
    # non-floor number only because VPA bumps memory targets on OOM *events*,
    # which it reads from container status rather than the metrics API.
    #
    # That makes sizing against it circular — the recommendation is derived from
    # the OOM, so it always trails reality: 512Mi limit -> OOMKilled -> VPA said
    # 422Mi -> set 1Gi -> OOMKilled again 2026-08-28 18:51 -> VPA now says
    # ~729Mi. Each kill just re-anchors the "recommendation" below the limit
    # that caused it. Do not re-size this from goldilocks.blackcats.cc.
    #
    # Real usage, 30d over 45 pod instances (metrics_path pinned to
    # /metrics/cadvisor — the kubelet exports container_* twice and an
    # unfiltered selector doubles everything):
    #   avg ~312 MiB   p99 ~595 MiB   peak 1000 MiB
    # The peak is *censored by the old limit* — working set cannot exceed it
    # before the OOM kill — so true demand is unknown beyond ">1Gi". 2Gi is
    # ~3.4x p99 and leaves room for the startup catch-up burst (queue drain +
    # cron + indexer at once), which is exactly when it must not die.
    # Request stays 512Mi, comfortably above the ~312 MiB average.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 2Gi

    extraEnvFrom:
      - secretRef:
          name: gitea-db-env

    gitea:
      admin:
        username: void
        email: mxmclaeys@gmail.com
        passwordMode: initialOnlyNoReset

      config:
        database:
          DB_TYPE: postgres
          HOST: postgres-rw.postgres.svc.cluster.local:5432
          NAME: gitea
          USER: gitea

        server:
          DOMAIN: gitea.blackcats.cc
          ROOT_URL: https://gitea.blackcats.cc/
          SSH_DOMAIN: gitea.blackcats.cc
          LFS_START_SERVER: true

        # NOTE: do not set cache / session / queue here. While valkey-cluster is
        # enabled the chart unconditionally overwrites ADAPTER, PROVIDER, TYPE
        # and the CONN_STR/HOST/PROVIDER_CONFIG values (`_helpers.tpl`, "valkey
        # queue" block) — anything declared here is silently discarded, so git
        # would claim `memory` while the pod actually runs against valkey.

        service:
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false

        log:
          LEVEL: warn
