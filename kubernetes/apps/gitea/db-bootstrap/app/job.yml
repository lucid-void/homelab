---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-db-bootstrap
  namespace: gitea
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gitea-db-bootstrap
      containers:
        - name: bootstrap
          image: alpine:3.24
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Bounded and unsilenced. An unbounded, output-silenced `apk add` hung
              # for ~40h on 2026-08-15 in gotify-bootstrap and gitea db-bootstrap:
              # pod Running and Ready, zero logs, `set -e` blocking the rest.
              # This exact line stalled gitea + gitea-backup for 40h.
              if ! timeout 300 apk add --no-cache kubectl; then
                echo "FATAL: apk add failed or exceeded 300s" >&2
                exit 1
              fi

              kubectl create secret generic gitea-db-env \
                --namespace=gitea \
                --from-literal="GITEA__database__PASSWD=${DB_PASSWORD}" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "gitea-db-env secret created/updated."
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-role-secret
                  key: password
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
