---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./rbac.yml
  - ./job.yml
  - ./token-sealed.yml
# The tofu config and both scripts are generated rather than inlined so that
# editing them is what triggers a re-run: the generated name carries a content
# hash, so a change alters the Job's pod spec, and `force: true` on the Flux
# Kustomization recreates the (immutable) Job instead of failing on it.
#
# .terraform.lock.hcl ships alongside main.tf so `tofu init -lockfile=readonly`
# resolves both providers to exact versions and checksums instead of re-resolving
# `~> 3.0` against the registry on every run. Regenerate after a deliberate
# provider bump with:
#   mise exec -- tofu -chdir=<tmpdir> providers lock -platform=linux_amd64
# using a file containing only the required_providers block from main.tf.
configMapGenerator:
  - name: zitadel-bootstrap-tf
    namespace: auth
    files:
      - main.tf=tofu/main.tf
      - run.sh=tofu/run.sh
      - report.sh=tofu/report.sh
      - .terraform.lock.hcl=tofu/.terraform.lock.hcl
