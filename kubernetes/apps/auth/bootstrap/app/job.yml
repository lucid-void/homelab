---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-bootstrap
  namespace: auth
  annotations:
    # Only the `tofu` initContainer leaves readOnlyRootFilesystem unset; the
    # `report` container sets it true. Deliberately left as-is rather than
    # hardened on a guess — .terraform/ goes to the workspace emptyDir, but
    # OpenTofu's other temp writes have not been traced, and a wrong guess here
    # stops OIDC provisioning for every app. The annotation is object-scoped, so
    # it unavoidably covers both containers.
    ignore-check.kube-linter.io/no-read-only-root-fs: "opentofu writes outside the workspace emptyDir"
spec:
  # Re-runs roughly hourly: the TTL deletes the finished Job and the Flux
  # Kustomization (interval 30m) recreates it. Matches gotify-bootstrap. Was 600,
  # which re-ran every ~30 min and doubled the registry traffic for no extra
  # detection value now that a drift run announces itself.
  ttlSecondsAfterFinished: 3600
  # run.sh blocks on an unbounded `until wget .../debug/healthz` and `tofu init`
  # reaches out to the provider registry; neither has a bound of its own. A
  # steady-state run takes well under a minute, so this only fires on a genuine
  # hang — the shape that wedged three bootstrap Jobs for days in August 2026.
  activeDeadlineSeconds: 1800
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: zitadel-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      # Connect directly to the Zitadel Service on port 8080 (h2c) rather than via
      # the Gateway. Historically the Cilium Gateway advertised no ALPN protocol so
      # gRPC-go 1.67+ (which enforces ALPN h2) failed on port 443; that is now fixed
      # cluster-wide (gatewayAPI.enableAlpn: true), but the direct path is retained
      # because it also avoids any external DNS/cert dependency during bootstrap.
      # Zitadel identifies its instance by the Host header so the domain must stay
      # zitadel.blackcats.cc, not the svc DNS name.
      # The ClusterIP is stable for the lifetime of the Service; if it ever changes
      # (Service deleted+recreated), update with:
      #   kubectl get svc zitadel -n auth -o jsonpath='{.spec.clusterIP}'
      hostAliases:
        - ip: "10.102.171.8"
          hostnames:
            - "zitadel.blackcats.cc"
      volumes:
        # Generated by configMapGenerator, so the name carries a content hash.
        # Editing main.tf/run.sh/report.sh therefore changes this pod spec, which
        # is what drives the re-run — see kustomization.yml.
        - name: tf-config
          configMap:
            name: zitadel-bootstrap-tf
            defaultMode: 0550
        - name: workspace
          emptyDir: {}
        # Carries the JSON plan from the initContainer to the report container.
        # Pod-scoped and ephemeral, which matters: the plan contains real client
        # secrets. See the note in run.sh.
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      # The apply runs to completion before anything is reported, so a failed
      # apply stops the pod here and never produces a misleading "no drift".
      initContainers:
        - name: tofu
          image: ghcr.io/opentofu/opentofu:1.12.6
          command:
            - /bin/sh
            - /tf-config/run.sh
          env:
            - name: TF_VAR_zitadel_pat
              valueFrom:
                secretKeyRef:
                  name: zitadel-bootstrap-token
                  key: token
            - name: HOME
              value: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tf-config
              mountPath: /tf-config
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: work
              mountPath: /work
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
      containers:
        # backup-tools bundles bash + curl + jq + kubectl, which is the whole
        # dependency set for classifying the plan and posting the result. The
        # opentofu image has none of them.
        - name: report
          image: ghcr.io/lucid-void/backup-tools:v1.1.0
          command: ["/bin/bash", "/tf-config/report.sh"]
          env:
            # kubectl writes a discovery cache under $HOME; the root filesystem
            # is read-only, so point it at the tmp emptyDir.
            - name: HOME
              value: /tmp
          envFrom:
            # Written by gotify-bootstrap. optional so the very first run (before
            # gotify-bootstrap has provisioned the token) still applies the config
            # and merely logs that it could not notify.
            - secretRef:
                name: gotify-secret
                optional: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tf-config
              mountPath: /tf-config
              readOnly: true
            - name: work
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
