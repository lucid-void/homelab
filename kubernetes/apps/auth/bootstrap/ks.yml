---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zitadel-bootstrap
  namespace: flux-system
spec:
  targetNamespace: auth
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: zitadel
    - name: sealed-secrets
  path: ./kubernetes/apps/auth/bootstrap/app
  prune: true
  force: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # wait: true — Flux waits for the Job to succeed before marking this ks healthy.
  # joplin ks depends on this: its SAML application lives in the Terraform, and
  # the app serves SP metadata that must match what Zitadel has registered.
  wait: true
  interval: 30m
  timeout: 30m
