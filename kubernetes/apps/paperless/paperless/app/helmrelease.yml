---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: paperless
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      app:
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: "3.1.0"
            env:
              TZ: Europe/Brussels
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: postgres-rw.postgres.svc.cluster.local
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: paperless
              PAPERLESS_DBUSER: paperless
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-role-secret
                    key: password
              PAPERLESS_REDIS: redis://paperless-valkey:6379
              PAPERLESS_URL: https://paperless.blackcats.cc
              PAPERLESS_TIME_ZONE: Europe/Brussels
              PAPERLESS_OCR_LANGUAGE: eng+fra+nld
              PAPERLESS_OCR_LANGUAGES: "nld fra"
              PAPERLESS_TIKA_ENABLED: "0"
              PAPERLESS_DATA_DIR: /data
              PAPERLESS_MEDIA_ROOT: /media
              PAPERLESS_CONSUMPTION_DIR: /consume
              # Semantics differ across the v3 boundary. v2: duplicates are always
              # rejected, this flag only decides whether the file is deleted from
              # /consume (true) or left there (false, the old default). v3: duplicates
              # are *consumed* by default and merely flagged in the UI, and this flag
              # restores rejection. True on v3 = reject + delete.
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"
              PAPERLESS_ACCOUNT_EMAIL_VERIFICATION: "none"
              # Proton Mail is end-to-end encrypted, so IMAP is only reachable
              # through the local Proton Mail Bridge — see the protonmail-bridge
              # HelmRelease alongside this one. Two settings are needed to talk
              # to it, and both are about TLS, not about mail.
              #
              # The bridge's certificate is self-signed AND carries exactly one
              # SAN: IP:127.0.0.1 (Proton hardcodes it — internal/certs/tls.go,
              # CommonName "127.0.0.1", IPAddresses{127.0.0.1}, no DNS names).
              # Trusting it is therefore only half the job; the address dialled
              # must also be literally 127.0.0.1, which is what the `bridge`
              # socat sidecar below exists to provide. Paperless builds its
              # context with ssl.create_default_context(), where check_hostname
              # is True and not configurable, so connecting to the Service DNS
              # name fails verification no matter what CA is trusted.
              #
              # DELIBERATELY COMMENTED OUT UNTIL THE BRIDGE IS BOOTSTRAPPED.
              # Uncomment in the same commit that adds cert-configmap.yml —
              # RUNBOOK step 4. Setting it earlier is a HARD STARTUP FAILURE,
              # not a deferred mail error: paperless registers a Django system
              # check (paperless/checks.py::_email_certificate_validate) that
              # raises Error "Email cert <path> is not a file" when the path is
              # set but absent, and an Error-level check aborts boot with
              # SystemCheckError. The optional mount below stops the kubelet
              # blocking on a missing ConfigMap; it does NOT stop paperless
              # refusing to start. Verified on 3.1.0 and 3.0.5 alike:
              #   kubectl exec deploy/paperless-app -c app -- \
              #     env PAPERLESS_EMAIL_CERTIFICATE_LOCATION=/nope \
              #     python manage.py check
              # Note also that load_verify_locations(cafile=...) REPLACES the
              # default trust store rather than adding to it, so once this is
              # set, any other mail account on a publicly-trusted IMAP server
              # would stop verifying. Only the bridge is expected here.
              # PAPERLESS_EMAIL_CERTIFICATE_LOCATION: /etc/ssl/protonmail/cert.pem
              # Defaults to true in 3.0.5, set explicitly because it is exactly
              # the kind of default that tightens: paperless 3.x resolves the
              # mail host and refuses non-public IPs (paperless_mail/mail.py,
              # "Connection blocked: … resolves to a non-public address"). The
              # bridge is 127.0.0.1, i.e. the most non-public address there is.
              PAPERLESS_EMAIL_ALLOW_INTERNAL_HOSTS: "true"
            envFrom:
              - secretRef:
                  name: paperless-app-secret
              - secretRef:
                  name: paperless-oidc-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8000
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                memory: 512Mi
                cpu: 100m
              limits:
                memory: 2Gi

          # Loopback shim for Proton Mail Bridge. Plain TCP forwarding only —
          # it terminates nothing, so STARTTLS is still negotiated end-to-end
          # between paperless and the bridge and the bridge's certificate
          # arrives untouched. Its entire purpose is to make the address
          # paperless dials be 127.0.0.1, the one SAN in that certificate.
          # Without it the mail account has to name the Service and Python
          # rejects the handshake with a hostname mismatch.
          bridge:
            image:
              repository: alpine/socat
              tag: 1.8.1.3
            args:
              - TCP-LISTEN:1143,bind=127.0.0.1,fork,reuseaddr
              - TCP:protonmail-bridge.paperless.svc.cluster.local:143
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                memory: 16Mi
                cpu: 10m
              limits:
                memory: 64Mi

      valkey:
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: 9.1-alpine
            resources:
              requests:
                memory: 64Mi
                cpu: 10m
              limits:
                memory: 256Mi

    service:
      app:
        controller: app
        ports:
          http:
            port: 8000
      valkey:
        controller: valkey
        ports:
          redis:
            port: 6379

    persistence:
      data:
        existingClaim: paperless-data
        advancedMounts:
          app:
            app:
              - path: /data
      media:
        existingClaim: paperless-media
        advancedMounts:
          app:
            app:
              - path: /media
      consume:
        existingClaim: paperless-consume
        advancedMounts:
          app:
            app:
              - path: /consume
      # The bridge's TLS certificate, exported once during bootstrap and
      # committed as a ConfigMap (a certificate is public; nothing to seal).
      # `type: custom` rather than `type: configMap` purely to get
      # `optional: true` — app-template's configMap volume schema has no such
      # field, and without it paperless would be stuck in ContainerCreating
      # from the moment this lands until the bootstrap is finished. Mounted as
      # a directory, not a subPath, so the kubelet refreshes the file in place
      # if the certificate is ever re-exported; paperless loads it per mail
      # fetch, so no restart is needed for it to take effect.
      bridge-cert:
        type: custom
        volumeSpec:
          configMap:
            name: protonmail-bridge-cert
            optional: true
        advancedMounts:
          app:
            app:
              - path: /etc/ssl/protonmail
                readOnly: true
