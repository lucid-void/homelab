---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes-sandbox
  namespace: flux-system
spec:
  targetNamespace: hermes
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: agent-sandbox
    - name: sealed-secrets
  path: ./kubernetes/apps/hermes/sandbox/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 5m
