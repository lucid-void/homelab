---
sources:
  - gateway-httproute
  - gateway-grpcroute
  # Needed for raw-TCP services that never pass through the Gateway — currently
  # only mc-router, which publishes the Minecraft hostnames at 172.16.20.51.
  # The annotation-filter below still applies, so a Service is only picked up if
  # it explicitly opts in; existing LoadBalancers (e.g. plex-direct) are untouched.
  - service

provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare
        key: api-token

extraArgs:
  - --annotation-filter=external-dns.alpha.kubernetes.io/enabled=true

domainFilters:
  - blackcats.cc

policy: sync
txtOwnerId: homelab-k8s
