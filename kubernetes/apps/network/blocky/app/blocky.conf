# Shared by both resolvers: the cluster Deployment (172.16.20.53) mounts it through
# a ConfigMap, and the Pi (172.16.20.7) pulls this exact file from main with
# /usr/local/sbin/blocky-sync. Edit here only. See design/decisions/dns.md.
#
# Named .conf on purpose: CI's kubeconform parses every .yml under kubernetes/ and
# rejects a file with no `kind:`. Do not use a dollar sign in here either, because
# Flux runs variable substitution over the rendered ConfigMap.

ports:
  dns: 53
  # Metrics, and an API with no auth that can switch blocking off. The Service never
  # exposes it, and on the Pi nftables admits only the cluster nodes.
  http: 4000

# IP literals, so neither resolver needs DNS (or CoreDNS) to find its upstreams.
upstreams:
  init:
    # Answer local names straight away, even if the internet is down at boot.
    strategy: fast
  strategy: parallel_best
  timeout: 2s
  groups:
    default:
      - tcp-tls:1.1.1.1:853
      - tcp-tls:9.9.9.9:853

# Resolves the blocklist hosts below without going through the OS resolver.
bootstrapDns:
  - upstream: tcp-tls:1.1.1.1:853
  - upstream: tcp-tls:9.9.9.9:853

# The whole point of this file: *.blackcats.cc answers with no internet at all.
# A mapping also covers its subdomains and the most specific entry wins, so the
# apex entry is the wildcard and the rest are the names not behind the Gateway.
#
# filterUnmappedTypes stays true: AAAA for these names gets an instant empty answer
# instead of a 2 s upstream timeout during an outage. The cost is that TXT lookups
# under blackcats.cc come back empty here, which is why cert-manager checks DNS-01
# directly against 1.1.1.1.
customDNS:
  customTTL: 5m
  filterUnmappedTypes: true
  mapping:
    blackcats.cc: 172.16.20.50
    k8s.blackcats.cc: 172.16.20.10
    cp-1.blackcats.cc: 172.16.20.11
    cp-2.blackcats.cc: 172.16.20.12
    cp-3.blackcats.cc: 172.16.20.13
    llm-1.blackcats.cc: 172.16.20.14
    synology.blackcats.cc: 172.16.20.2
    nas.blackcats.cc: 172.16.20.2
    pve.blackcats.cc: 172.16.20.3
    pi.blackcats.cc: 172.16.20.7
    matcha.blackcats.cc: 172.16.20.52
    vanilla.blackcats.cc: 172.16.20.52

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt
  clientGroupsBlock:
    default:
      - ads
  blockType: zeroIp
  loading:
    refreshPeriod: 12h
    # Serve straight away and block once the lists have loaded.
    strategy: fast
    downloads:
      # Lets a restart during an internet outage reuse the last downloaded lists.
      cachePath: /var/cache/blocky/lists

caching:
  minTime: 5m
  prefetching: true
  cacheTimeNegative: 5m

prometheus:
  enable: true

# Names clients from the UDM's DHCP leases, e.g. Living-Room-TV.
clientLookup:
  upstream: 172.16.20.254

# Per-device lookup history for the "Blocky query" dashboard. The DSN is a local
# file because this config is public: a Secret in the cluster, a file on the Pi.
#
# creationAttempts stays 1. Blocky retries this BEFORE it starts answering DNS, so
# more attempts mean no DNS at all while the log database is down. It falls back to
# not logging until restarted; see design/decisions/dns.md for how each side recovers.
queryLog:
  type: postgresql
  target: file:/etc/blocky/querylog-dsn
  logRetentionDays: 14
  flushInterval: 30s
  creationAttempts: 1
  creationCooldown: 1s

# warn, not info: in the fallback above, info would print every query to the journal
# on the Pi and rotate away the UPS shutdown logs.
log:
  level: warn
  format: text
