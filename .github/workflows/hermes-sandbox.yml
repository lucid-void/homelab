name: Build hermes-sandbox

on:
  push:
    branches: [main]
    paths:
      - kubernetes/images/hermes-sandbox/**
      - .github/workflows/hermes-sandbox.yml
  workflow_dispatch:

env:
  # Bump with every image change, then bump the tag in
  # kubernetes/apps/hermes/sandbox/app/sandbox.yml to match.
  IMAGE_VERSION: "1.0.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: lucid-void/hermes-sandbox
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ env.IMAGE_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: kubernetes/images/hermes-sandbox
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
