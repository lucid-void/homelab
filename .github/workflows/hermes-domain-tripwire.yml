name: Hermes domain tripwire

# Hermes Agent pushes hermes/* branches to this PUBLIC repo before anyone
# reviews them, and the model it runs on has seen the real cluster domain
# (Gitea API links carry it). This does not prevent a leak — the push is
# already public — it makes one loud within a minute so the branch can be
# deleted and GitHub Support asked to purge it. See design/decisions/hermes.md.
#
# The agent cannot weaken this: its token has no `workflow` scope, so GitHub
# rejects any push that touches .github/workflows/, and a push event runs the
# workflow as committed on the pushed ref.
#
# Needs the repository Actions secret CLUSTER_DOMAIN (the bare domain).

on:
  push:
    branches: ["hermes/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'hermes/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan pushed commits for the cluster domain
        env:
          DOMAIN: ${{ secrets.CLUSTER_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${DOMAIN}" ]; then
            echo "::error::CLUSTER_DOMAIN Actions secret is not set; the tripwire is blind"
            exit 1
          fi
          # Range: everything on this ref that is not on main — a new branch
          # and a force-push alike.
          git fetch --quiet origin main
          range="origin/main..HEAD"
          hits=0
          # Diff content (added lines only) and commit messages. Matches are
          # counted, never printed — the log is public too.
          if git log -p --format='%B' "$range" | grep -F -i -q -- "${DOMAIN}"; then
            hits=1
          fi
          if git log --format='%an %ae %cn %ce' "$range" | grep -F -i -q -- "${DOMAIN}"; then
            hits=1
          fi
          if [ "$hits" -ne 0 ]; then
            echo "::error::A commit on ${GITHUB_REF_NAME} contains the private cluster domain. Delete the branch and follow the domain-leak procedure in design/decisions/hermes.md."
            exit 1
          fi
          echo "clean"
