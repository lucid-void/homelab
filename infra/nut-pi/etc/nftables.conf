#!/usr/sbin/nft -f
flush ruleset

# Only the cluster, Proxmox and Synology may talk to upsd (DSM forces
# the public monuser/secret login). Everything else stays open.
table inet nut {
  set allowed4 {
    type ipv4_addr
    elements = { 172.16.20.2, 172.16.20.3, 172.16.20.11, 172.16.20.12, 172.16.20.13, 172.16.20.14 }
  }
  chain input {
    type filter hook input priority 0; policy accept;
    iifname "lo" accept
    tcp dport 3493 ip saddr @allowed4 accept
    tcp dport 3493 drop
  }
}
